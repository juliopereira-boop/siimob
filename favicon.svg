<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 1280" width="1280" height="1280">
  <!-- Ícone da aba: a marca oficial sobre fundo branco arredondado, que é como
       ela foi desenhada. A 16px o que se enxerga é o contorno do S, então as
       peças ganham uma folga menor que no arquivo solto para ocuparem mais. -->
  <defs>
    <linearGradient id="fv-a" x1="172" y1="530" x2="466" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0B534E"/><stop offset="55%" stop-color="#149287"/><stop offset="100%" stop-color="#33E9D7"/>
    </linearGradient>
    <linearGradient id="fv-b" x1="820" y1="163" x2="820" y2="455" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0B534E"/><stop offset="55%" stop-color="#159A8E"/><stop offset="100%" stop-color="#3BF0DE"/>
    </linearGradient>
    <linearGradient id="fv-c" x1="462" y1="825" x2="462" y2="1115" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3BF0DE"/><stop offset="45%" stop-color="#159A8E"/><stop offset="100%" stop-color="#0B534E"/>
    </linearGradient>
    <linearGradient id="fv-d" x1="1108" y1="750" x2="814" y2="1080" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0B534E"/><stop offset="55%" stop-color="#149287"/><stop offset="100%" stop-color="#33E9D7"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="1280" rx="280" fill="#FFFFFF"/>
  <g transform="translate(640 640) scale(1.1) translate(-641 -639)">
