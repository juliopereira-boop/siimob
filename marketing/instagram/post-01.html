  .ref{position:absolute;right:88px;top:78px;text-align:right;
       font-family:'GM';font-size:11px;letter-spacing:.28em;color:#4E7F79;line-height:2}

  .manchete{position:absolute;left:88px;top:194px;width:912px;

  .legenda{position:absolute;left:88px;top:420px;

  /* ── registro ─────────────────────────────────────────────────── */
  .rot{position:absolute;font-family:'GM';font-size:10px;letter-spacing:.26em;color:#4E7F79}

    background:repeating-linear-gradient(180deg,rgba(190,242,236,.34) 0 3px,rgba(190,242,236,0) 3px 8px)}

  .tq{position:absolute;width:1px;height:9px;background:rgba(51,233,215,.55)}
  .cota{position:absolute;font-family:'GMB';font-size:13px;letter-spacing:.18em;color:#33E9D7}

  .nota{position:absolute;left:88px;top:1046px;width:760px;

  .arroba{position:absolute;left:88px;top:1224px;font-family:'IS';font-size:27px;color:#D6EDE9}
  .publico{position:absolute;right:88px;top:1233px;

    <defs>
      <linearGradient id="a" x1="172" y1="530" x2="466" y2="200" gradientUnits="userSpaceOnUse">
        <stop offset="0%" stop-color="#0F6D65"/><stop offset="55%" stop-color="#1CB3A5"/><stop offset="100%" stop-color="#4DF3E2"/></linearGradient>

        <stop offset="0%" stop-color="#0F6D65"/><stop offset="55%" stop-color="#1CB3A5"/><stop offset="100%" stop-color="#4DF3E2"/></linearGradient>
      <linearGradient id="c" x1="462" y1="825" x2="462" y2="1115" gradientUnits="userSpaceOnUse">
        <stop offset="0%" stop-color="#4DF3E2"/><stop offset="45%" stop-color="#1CB3A5"/><stop offset="100%" stop-color="#0F6D65"/></linearGradient>
      <linearGradient id="d" x1="1108" y1="750" x2="814" y2="1080" gradientUnits="userSpaceOnUse">
        <stop offset="0%" stop-color="#0F6D65"/><stop offset="55%" stop-color="#1CB3A5"/><stop offset="100%" stop-color="#4DF3E2"/></linearGradient>
    </defs>
    <path d="M466 165 A290 290 0 0 0 466 745 Z" fill="url(#a)"/>
    <rect x="530" y="163" width="580" height="292" rx="146" fill="url(#b)"/>

  </svg>
  <div class="nome">SIIMOB</div>
</div>

<div class="rot" id="rotLim"></div>

<div class="campo" id="campo">
  <div class="limite" id="limite"></div>
</div>

<div class="nota">O sistema conta os dias.<br>Você recebe o nome, a etapa e o valor.</div>

<div class="fio" style="top:1186px"></div>
<div class="arroba">@siimob</div>
<div class="publico">CORRESPONDENTES · CONSTRUTORAS · IMOBILIÁRIAS</div>

<script>
// ─── O registro ──────────────────────────────────────────────────────────────
// Vinte processos, uma linha cada, marca a marca. Quase todos param antes do
// limite aceitável. Um atravessa — e é o único que muda de cor. A descoberta
// tem de ser do olho, nunca do dedo apontando.
const campo  = document.getElementById('campo');
const L = 904, LINHAS = 20, ALTURA_LINHA = 24, PASSO = 14, LARG = 8;
const LIMITE = 602;          // x do limite aceitável
const EXC = 12;              // a linha que atravessa

// Comprimentos escolhidos a mão: ritmo irregular o bastante para parecer
// registro de verdade, controlado o bastante para não virar ruído.
const COMP = [266, 392, 174, 546, 322, 448, 210, 574, 350, 130,
              490, 286, 862, 238, 420, 160, 508, 304, 378, 202];

for (let r = 0; r < LINHAS; r++) {
  const y = r * ALTURA_LINHA;
  const comp = COMP[r];
  const n = Math.round(comp / PASSO);
  const ehExc = (r === EXC);

  for (let i = 0; i < n; i++) {
    const x = i * PASSO;
    const m = document.createElement('div');
    m.className = 'm';
    m.style.left = x + 'px';
    m.style.top  = y + 'px';
    m.style.width = LARG + 'px';

    if (ehExc && x >= LIMITE) {
      // O trecho que passou do limite: é isto que o sistema cobra.
      m.style.opacity = 1;
      m.style.boxShadow = '0 0 10px rgba(51,233,215,.55)';
    } else if (ehExc) {
      m.style.opacity = .52;
    } else {
      m.style.opacity = (0.28 + ((r * 7 + i) % 5) * 0.026).toFixed(3);
    }
    campo.appendChild(m);
  }

  if (ehExc) {
    const c = document.createElement('div');
    c.className = 'cabeca';
    c.style.left = (comp - 2) + 'px';
    c.style.top  = (y - 2) + 'px';
    campo.appendChild(c);
  }
}

// ─── Limite aceitável ────────────────────────────────────────────────────────
const lim = document.getElementById('limite');
lim.style.left = LIMITE + 'px';
lim.style.top = '-22px';
lim.style.height = (LINHAS * ALTURA_LINHA + 34) + 'px';

const rotLim = document.getElementById('rotLim');
rotLim.textContent = 'LIMITE ACEITÁVEL';
rotLim.style.left = (88 + LIMITE + 12) + 'px';
rotLim.style.top  = '486px';

// ─── A cota do excedente ─────────────────────────────────────────────────────
const yExc = EXC * ALTURA_LINHA;
const fim  = COMP[EXC];
const yBraco = yExc + 30;

const braco = document.createElement('div');
braco.className = 'braco';
braco.style.left = LIMITE + 'px';
braco.style.top  = yBraco + 'px';
braco.style.width = (fim - LIMITE) + 'px';
campo.appendChild(braco);

[LIMITE, fim].forEach(x => {
  const t = document.createElement('div');
  t.className = 'tq';
  t.style.left = x + 'px';
  t.style.top  = (yBraco - 4) + 'px';
  campo.appendChild(t);
});

const cota = document.createElement('div');
cota.className = 'cota';
cota.style.left = LIMITE + 'px';
cota.style.top  = (yBraco + 14) + 'px';
cota.textContent = '17 DIAS PARADO';
campo.appendChild(cota);
</script>
