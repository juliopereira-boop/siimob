  .marca{position:absolute;left:88px;top:72px;display:flex;align-items:center;gap:15px}
  .marca .nome{font-family:'GM';font-size:16px;letter-spacing:.44em;color:#D6EDE9;padding-top:3px}
  .ref{position:absolute;right:88px;top:78px;text-align:right;
       font-family:'GM';font-size:11px;letter-spacing:.28em;color:#4E7F79;line-height:2}
  .fio{position:absolute;left:88px;width:904px;height:1px;background:rgba(180,235,228,.13)}

  .manchete{position:absolute;left:88px;top:194px;width:912px;
    font-family:'IS';font-size:89px;line-height:1.05;color:#EAF6F4;letter-spacing:-.012em}
  .manchete .b{color:#33E9D7}
  .legenda{position:absolute;left:88px;top:420px;
    font-family:'GM';font-size:11.5px;letter-spacing:.26em;color:#6E9A95}

  /* ── a travessia ──────────────────────────────────────────────── */
  .rot{position:absolute;font-family:'GM';font-size:10px;letter-spacing:.26em;color:#4E7F79}
  .campo{position:absolute;left:88px;top:510px;width:904px;height:452px}

  .eixo{position:absolute;left:0;bottom:0;width:904px;height:1px;
    background:linear-gradient(90deg,rgba(51,233,215,.16) 0%,rgba(51,233,215,.44) 50%,rgba(51,233,215,.16) 100%)}
  .no{position:absolute;bottom:-4.5px;width:10px;height:10px;border-radius:50%;
    background:#04211E;border:1.5px solid #33E9D7}
  .tique{position:absolute;bottom:-5px;width:1px;height:10px;background:rgba(51,233,215,.30)}
  .etapa{position:absolute;font-family:'GMB';font-size:11px;letter-spacing:.22em;color:#8FD6CD}

  .p{position:absolute;width:10px;height:10px;border-radius:50%;background:#33E9D7}
  .p.aceso{background:#8FFDF0;box-shadow:0 0 14px rgba(124,251,236,.95),0 0 36px rgba(51,233,215,.5)}

  .guia{position:absolute;height:1px;
    background:repeating-linear-gradient(90deg,rgba(51,233,215,.55) 0 4px,rgba(51,233,215,0) 4px 10px)}
  .cota{position:absolute;font-family:'GMB';font-size:13px;letter-spacing:.18em;color:#33E9D7}
  .cota small{display:block;font-family:'GM';font-weight:400;font-size:10px;
    letter-spacing:.26em;color:#5E938D;margin-top:7px}

  .nota{position:absolute;left:88px;top:1040px;width:820px;
    font-family:'ISI';font-style:italic;font-size:27px;line-height:1.42;color:#9FC7C1}

  .arroba{position:absolute;left:88px;top:1224px;font-family:'IS';font-size:27px;color:#D6EDE9}
  .publico{position:absolute;right:88px;top:1233px;
    font-family:'GM';font-size:11px;letter-spacing:.24em;color:#4E7F79}
</style>

<div class="luz"></div>
<div class="grao"></div>

<div class="marca">
  <svg width="38" height="38" viewBox="0 0 1280 1280">
    <defs>
      <linearGradient id="a" x1="172" y1="530" x2="466" y2="200" gradientUnits="userSpaceOnUse">
        <stop offset="0%" stop-color="#0F6D65"/><stop offset="55%" stop-color="#1CB3A5"/><stop offset="100%" stop-color="#4DF3E2"/></linearGradient>
      <linearGradient id="b" x1="820" y1="163" x2="820" y2="455" gradientUnits="userSpaceOnUse">
        <stop offset="0%" stop-color="#0F6D65"/><stop offset="55%" stop-color="#1CB3A5"/><stop offset="100%" stop-color="#4DF3E2"/></linearGradient>
      <linearGradient id="c" x1="462" y1="825" x2="462" y2="1115" gradientUnits="userSpaceOnUse">
        <stop offset="0%" stop-color="#4DF3E2"/><stop offset="45%" stop-color="#1CB3A5"/><stop offset="100%" stop-color="#0F6D65"/></linearGradient>
      <linearGradient id="d" x1="1108" y1="750" x2="814" y2="1080" gradientUnits="userSpaceOnUse">
        <stop offset="0%" stop-color="#0F6D65"/><stop offset="55%" stop-color="#1CB3A5"/><stop offset="100%" stop-color="#4DF3E2"/></linearGradient>
    </defs>
    <path d="M466 165 A290 290 0 0 0 466 745 Z" fill="url(#a)"/>
    <rect x="530" y="163" width="580" height="292" rx="146" fill="url(#b)"/>
    <rect x="172" y="825" width="580" height="290" rx="145" fill="url(#c)"/>
    <path d="M818 535 A290 290 0 0 1 818 1115 Z" fill="url(#d)"/>
  </svg>
  <div class="nome">SIIMOB</div>
</div>

<div class="ref">FIG. 01<br>A TRAVESSIA</div>
<div class="fio" style="top:134px"></div>

<div class="manchete">
  Do lead ao registro.<br>Inclusive o que <span class="b">parou</span>.
</div>
<div class="legenda">CRM · REPASSE · REGISTRO — UM CADASTRO SÓ</div>
<div class="rot" style="right:88px;top:421px">CADA PONTO, UM PROCESSO</div>

<div class="campo" id="campo"><div class="eixo"></div></div>

<div class="nota">Onde a fila engrossa, você vê.<br>Quem está parado nela, o sistema entrega.</div>

<div class="fio" style="top:1186px"></div>
<div class="arroba">@siimobcrm</div>
<div class="publico">CORRESPONDENTES · CONSTRUTORAS · IMOBILIÁRIAS</div>

<script>
// ─── A travessia ─────────────────────────────────────────────────────────────
// Uma coluna por etapa do caminho, do lead ao registro. A altura de cada coluna
// é a fila parada ali. O desenho diz duas coisas de uma vez: o sistema cobre a
// jornada inteira, e mostra em que ponto dela a operação está entalada.
//
// As etapas do meio não são nomeadas de propósito — elas são desenhadas por
// cada cliente. Nomear seria prometer um fluxo que não é o dele.
const campo = document.getElementById('campo');
const L = 904, COLS = 14;
const PASSO = L / (COLS - 1);
const D = 10, VAO = 13;        // diâmetro do ponto e espaçamento vertical

// A fila em cada etapa. O relevo é o argumento: sobe até o gargalo e desce.
const FILA = [6, 9, 7, 12, 9, 15, 20, 13, 8, 10, 6, 7, 4, 3];
const GARGALO = 6;             // a coluna mais alta — e onde está o esquecido

const colunas = [];
for (let c = 0; c < COLS; c++) {
  const x = Math.round(c * PASSO);
  const n = FILA[c];
  let topo = null;

  for (let i = 0; i < n; i++) {
    const p = document.createElement('div');
    p.className = 'p';
    p.style.left = (x - D / 2) + 'px';
    p.style.bottom = (16 + i * VAO) + 'px';
    // Os de baixo entraram há mais tempo; o topo da pilha é o mais recente.
    p.style.opacity = (0.30 + (i / Math.max(n - 1, 1)) * 0.26).toFixed(3);
    campo.appendChild(p);
    topo = p;
  }
  colunas.push(topo);

  const ancora = (c === 0 || c === GARGALO || c === COLS - 1);
  const marca = document.createElement('div');
  marca.className = ancora ? 'no' : 'tique';
  marca.style.left = (x - (ancora ? 5 : 0.5)) + 'px';
  campo.appendChild(marca);
}

// ─── O que parou ─────────────────────────────────────────────────────────────
// No alto da fila maior, um ponto aceso — e a cota que o mede. É a diferença
// entre ver uma fila e saber QUEM está nela.
const xP = Math.round(GARGALO * PASSO);
const yP = 16 + (FILA[GARGALO] - 1) * VAO;

const alvo = colunas[GARGALO];
alvo.className = 'p aceso';
alvo.style.opacity = 1;

const guia = document.createElement('div');
guia.className = 'guia';
guia.style.left = (xP + 15) + 'px';
guia.style.bottom = (yP + D / 2) + 'px';
guia.style.width = (L - xP - 15) + 'px';
campo.appendChild(guia);

const cota = document.createElement('div');
cota.className = 'cota';
cota.style.right = '0px';
cota.style.bottom = (yP + D / 2 + 15) + 'px';
cota.style.textAlign = 'right';
cota.innerHTML = '17 DIAS<small>PARADO NESTA ETAPA</small>';
campo.appendChild(cota);

// ─── As âncoras do caminho ───────────────────────────────────────────────────
const ancoras = [[0, 'LEAD', 'esq'], [GARGALO, 'REPASSE', 'meio'], [COLS - 1, 'REGISTRO', 'dir']];
ancoras.forEach(([c, texto, lado]) => {
  const x = Math.round(c * PASSO);
  const e = document.createElement('div');
  e.className = 'etapa';
  e.textContent = texto;
  e.style.top = '980px';
  if (lado === 'esq')  e.style.left = '88px';
  if (lado === 'dir')  e.style.right = '88px';
  if (lado === 'meio') { e.style.left = (88 + x) + 'px'; e.style.transform = 'translateX(-50%)'; }
  document.body.appendChild(e);
});
</script>
