<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Entrar — ALPHA ONE</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="/css/alpha.css">
  <style>
    .login-wrap { max-width: 22rem; width: 100%; }
    .logo { font-size: 1.5rem; font-weight: 800; letter-spacing: -.04em; margin-bottom: 1.5rem; text-align: center; }
    .logo span { color: var(--accent); }
    .tenant-name {
      text-align: center;
      color: var(--muted);
      font-size: .8rem;
      margin-bottom: 1.5rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: .4rem;
    }
    .tenant-slug { color: var(--accent); font-weight: 600; }
    .tab-row { display: flex; border-bottom: 1px solid var(--border); margin-bottom: 1.5rem; }
    .tab {
      flex: 1; padding: .6rem; text-align: center; font-size: .8rem; font-weight: 600;
      color: var(--muted); cursor: pointer; border-bottom: 2px solid transparent;
      transition: color .15s, border-color .15s;
    }
    .tab.active { color: var(--accent); border-bottom-color: var(--accent); }
    .error-msg {
      background: #7f1d1d33; border: 1px solid #dc262633; color: #fca5a5;
      padding: .6rem .875rem; border-radius: .4rem; font-size: .8rem; margin-bottom: 1rem;
    }
    .back-link {
      display: block; text-align: center; color: var(--muted);
      font-size: .75rem; margin-top: 1.25rem; text-decoration: none;
    }
    .back-link:hover { color: var(--text); }
  </style>
</head>
<body>
<div class="page-center">
  <div class="login-wrap">
    <div class="logo">ALPHA <span>ONE</span></div>
    <div class="tenant-name">
      <span>Empresa:</span>
      <span class="tenant-slug" id="tenant-slug-display">—</span>
    </div>

    <div class="card">
      <div class="tab-row">
        <div class="tab active" onclick="switchTab('user')"  id="tab-user">Usuário</div>
        <div class="tab"        onclick="switchTab('partner')" id="tab-partner">Parceiro</div>
      </div>

      <div id="error-msg" class="error-msg" style="display:none"></div>

      <form id="login-form" onsubmit="doLogin(event)">
        <div class="form-group">
          <label>CPF</label>
          <input id="cpf" type="text" inputmode="numeric" placeholder="000.000.000-00"
                 autocomplete="username" maxlength="14" required>
        </div>
        <div class="form-group">
          <label>Senha</label>
          <input id="password" type="password" placeholder="••••••••"
                 autocomplete="current-password" required>
        </div>
        <button type="submit" class="btn btn-primary btn-full" id="btn-login">
          Entrar
        </button>
      </form>
    </div>

    <a href="/" class="back-link">← Trocar empresa</a>
  </div>
</div>

<div id="a1-toast"></div>

<script src="/js/config.js"></script>
<script src="/js/auth.js"></script>
<script>
  let activeTab = 'user';
  const slug    = getSlugFromURL();

  // Show slug
  document.getElementById('tenant-slug-display').textContent = slug || '?';

  // If already logged in for this slug, go to dashboard
  if (A1.token && A1.slug === slug && A1.user) {
    window.location.href = `/${slug}/dashboard`;
  }

  // CPF mask
  document.getElementById('cpf').addEventListener('input', e => {
    let v = e.target.value.replace(/\D/g, '').slice(0, 11);
    if (v.length > 9)      v = v.replace(/(\d{3})(\d{3})(\d{3})(\d{1,2})/, '$1.$2.$3-$4');
    else if (v.length > 6) v = v.replace(/(\d{3})(\d{3})(\d{1,3})/, '$1.$2.$3');
    else if (v.length > 3) v = v.replace(/(\d{3})(\d{1,3})/, '$1.$2');
    e.target.value = v;
  });

  function switchTab(tab) {
    activeTab = tab;
    document.getElementById('tab-user').classList.toggle('active', tab === 'user');
    document.getElementById('tab-partner').classList.toggle('active', tab === 'partner');
  }

  function showError(msg) {
    const el = document.getElementById('error-msg');
    el.textContent = msg;
    el.style.display = 'block';
  }

  async function doLogin(e) {
    e.preventDefault();
    const cpf      = document.getElementById('cpf').value;
    const password = document.getElementById('password').value;
    const btn      = document.getElementById('btn-login');
    const errEl    = document.getElementById('error-msg');

    errEl.style.display = 'none';
    btn.disabled = true;
    btn.innerHTML = '<div class="spinner"></div>';

    try {
      if (!slug) throw new Error('URL inválida. Acesse /<slug>/login');

      if (activeTab === 'user') {
        await a1Login(slug, cpf, password);
      } else {
        await a1PartnerLogin(slug, cpf, password);
      }

      window.location.href = `/${slug}/dashboard`;

    } catch (err) {
      showError(err.message || 'Erro ao fazer login.');
      btn.disabled = false;
      btn.textContent = 'Entrar';
    }
  }
</script>
</body>
</html>
