<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Entrar — COREON</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root{
      --bg:#F8FAFC;--card:#fff;--border:#E2E8F0;--border2:#CBD5E1;
      --t1:#0F172A;--t2:#475569;--t3:#94A3B8;--t4:#CBD5E1;
      --shadow:0 1px 3px rgba(0,0,0,.06),0 4px 12px rgba(0,0,0,.04);
      --shadow-lg:0 8px 32px rgba(0,0,0,.08),0 24px 64px rgba(0,0,0,.05);
      --green:#3D5CC8;--green-dark:#1E3A8A;--radius:10px;
    }
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'Inter',sans-serif;color:var(--t1);min-height:100vh;display:flex;font-size:14px;-webkit-font-smoothing:antialiased}
    input,button{font-family:inherit}
    a{text-decoration:none;color:inherit}
    .hidden{display:none!important}

    /* ── Left panel ── */
    .left-panel{
      width:42%;min-width:320px;
      background:linear-gradient(155deg,#0F172A 0%,#1e293b 60%,#0f2027 100%);
      display:flex;flex-direction:column;justify-content:space-between;
      padding:3rem 3rem;position:relative;overflow:hidden;
    }
    .left-panel::before{
      content:'';position:absolute;inset:0;
      background:radial-gradient(ellipse at 20% 80%,rgba(67,97,238,.18) 0%,transparent 60%),
                 radial-gradient(ellipse at 80% 20%,rgba(56,217,245,.08) 0%,transparent 50%);
    }
    .left-content{position:relative;z-index:1;flex:1;display:flex;flex-direction:column;justify-content:center}
    .left-logo{
      font-size:1.75rem;font-weight:900;letter-spacing:-.05em;color:#fff;
      margin-bottom:1rem;display:flex;align-items:center;gap:.5rem;
    }
    .left-logo-dot{width:8px;height:8px;border-radius:50%;background:var(--green);flex-shrink:0}
    .left-tagline{font-size:1.5rem;font-weight:700;color:#e2e8f0;line-height:1.35;margin-bottom:1.5rem}
    .left-tagline span{color:var(--green)}
    .left-sub{font-size:.82rem;color:#64748b;line-height:1.6;max-width:280px}
    .left-footer{position:relative;z-index:1;font-size:.7rem;color:#334155}
    .tenant-badge{
      display:inline-flex;align-items:center;gap:.4rem;
      background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:99px;
      padding:.3rem .875rem;font-size:.72rem;color:#94a3b8;font-weight:600;
      margin-top:2rem;
    }
    .tenant-dot{width:6px;height:6px;border-radius:50%;background:var(--green);flex-shrink:0}

    /* ── Right panel ── */
    .right-panel{
      flex:1;background:var(--bg);display:flex;flex-direction:column;
      justify-content:center;align-items:center;padding:3rem 2rem;overflow-y:auto;
    }
    .right-inner{width:100%;max-width:460px}
    .right-header{margin-bottom:2rem}
    .right-header h1{font-size:1.5rem;font-weight:800;letter-spacing:-.03em;margin-bottom:.3rem}
    .right-header p{color:var(--t3);font-size:.83rem}

    /* ── Panel cards ── */
    .panels-grid{display:grid;grid-template-columns:1fr 1fr;gap:.875rem}
    .panel-card{
      display:flex;flex-direction:column;gap:.5rem;padding:1.1rem 1rem;
      border:2px solid var(--border);border-radius:14px;cursor:pointer;
      transition:all .18s;background:#fff;position:relative;overflow:hidden;
    }
    .panel-card:hover{box-shadow:0 6px 20px rgba(0,0,0,.09);transform:translateY(-2px)}
    .panel-card-icon{
      width:38px;height:38px;border-radius:10px;
      display:flex;align-items:center;justify-content:center;margin-bottom:.25rem;flex-shrink:0;
    }
    .panel-card-icon svg{width:20px;height:20px}
    .panel-card-title{font-size:.88rem;font-weight:700;color:var(--t1);line-height:1.2}
    .panel-card-sub{font-size:.72rem;color:var(--t3)}
    .panel-card-arrow{
      position:absolute;right:.9rem;top:50%;transform:translateY(-50%);
      color:var(--t4);transition:color .15s,transform .15s;
    }
    .panel-card:hover .panel-card-arrow{transform:translateY(-50%) translateX(2px);color:var(--t2)}

    /* card accent colors */
    .panel-card.gestor{border-color:#3D5CC830}
    .panel-card.gestor:hover{border-color:#3D5CC8}
    .panel-card.gestor .panel-card-icon{background:#EEF2FF}
    .panel-card.cca{border-color:#3B82F630}
    .panel-card.cca:hover{border-color:#3B82F6}
    .panel-card.cca .panel-card-icon{background:#eff6ff}
    .panel-card.despachante{border-color:#F59E0B30}
    .panel-card.despachante:hover{border-color:#F59E0B}
    .panel-card.despachante .panel-card-icon{background:#fffbeb}

    /* ── Login form ── */
    .back-btn{
      display:inline-flex;align-items:center;gap:.4rem;
      background:none;border:none;color:var(--t3);font-size:.78rem;font-weight:500;
      cursor:pointer;padding:.2rem 0;margin-bottom:1.5rem;transition:color .15s;
    }
    .back-btn:hover{color:var(--t1)}
    .role-badge{
      display:inline-flex;align-items:center;gap:.5rem;
      padding:.25rem .875rem;border-radius:99px;font-size:.72rem;font-weight:700;
      letter-spacing:.03em;text-transform:uppercase;margin-bottom:1rem;
    }
    .role-badge.gestor{background:#EEF2FF;color:#1E3A8A;border:1px solid #A5B4FC}
    .role-badge.cca{background:#eff6ff;color:#1d4ed8;border:1px solid #bfdbfe}
    .role-badge.despachante{background:#fffbeb;color:#92400e;border:1px solid #fde68a}
    .form-title{font-size:1.3rem;font-weight:800;letter-spacing:-.03em;margin-bottom:1.5rem}
    .form-group{display:flex;flex-direction:column;gap:.28rem;margin-bottom:1rem}
    .form-group label{font-size:.65rem;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--t3)}
    .input-wrap{position:relative;display:flex;align-items:center}
    .input-wrap input{
      width:100%;padding:.65rem .875rem;border:1.5px solid var(--border);
      border-radius:9px;font-size:.875rem;color:var(--t1);background:#fff;
      transition:border-color .15s,box-shadow .15s;
    }
    .input-wrap input:focus{outline:none;border-color:var(--green);box-shadow:0 0 0 3px rgba(67,97,238,.1)}
    .input-wrap input.has-toggle{padding-right:2.5rem}
    .toggle-pw{
      position:absolute;right:.65rem;background:none;border:none;
      cursor:pointer;color:var(--t4);padding:.2rem;display:flex;align-items:center;transition:color .15s;
    }
    .toggle-pw:hover{color:var(--t2)}
    .error-box{
      background:#fef2f2;border:1px solid #fca5a5;color:#991b1b;
      border-radius:8px;padding:.55rem .75rem;font-size:.78rem;font-weight:500;margin-bottom:1rem;
    }
    .btn-login{
      width:100%;padding:.78rem;border:none;border-radius:9px;
      background:var(--green);color:#fff;font-size:.875rem;font-weight:700;
      cursor:pointer;transition:background .15s,transform .1s;
      display:flex;align-items:center;justify-content:center;gap:.5rem;margin-top:.5rem;
    }
    .btn-login:hover{background:var(--green-dark)}
    .btn-login:active{transform:scale(.99)}
    .btn-login:disabled{opacity:.6;cursor:default}
    .spinner{width:15px;height:15px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .6s linear infinite;flex-shrink:0}
    @keyframes spin{to{transform:rotate(360deg)}}
    .switch-link{display:block;text-align:center;color:var(--t3);font-size:.73rem;margin-top:1.5rem}
    .switch-link a{color:var(--green);font-weight:600;cursor:pointer}
    .switch-link a:hover{color:var(--green-dark)}

    /* ── Loading ── */
    .loading-panels{
      display:flex;flex-direction:column;gap:.875rem;
    }
    .skel{height:72px;background:#e2e8f0;border-radius:14px;animation:pulse 1.2s ease-in-out infinite}
    .skel-row{display:grid;grid-template-columns:1fr 1fr;gap:.875rem}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}

    @media(max-width:720px){
      body{flex-direction:column}
      .left-panel{width:100%;min-width:0;padding:2rem 1.5rem;min-height:200px}
      .left-tagline{font-size:1.2rem}
      .left-sub,.left-footer{display:none}
      .right-panel{padding:2rem 1.25rem}
      .panels-grid{grid-template-columns:1fr}
    }
  </style>
</head>
<body>

<!-- ── Left panel ── -->
<div class="left-panel">
  <div class="left-content">
    <div class="left-logo" style="gap:.6rem"><svg width="40" height="40" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg"><defs><linearGradient id="lmglo" x1="50" y1="0" x2="50" y2="100" gradientUnits="userSpaceOnUse"><stop offset="0%" stop-color="#7090E8"/><stop offset="100%" stop-color="#3D5CC8"/></linearGradient></defs><polygon points="10,8 84,4 81,29 7,33" fill="url(#lmglo)"/><polygon points="7,33 26,31 26,57 7,59" fill="#0D1A5E"/><path d="M7,59 L62,54 L62,42 L80,40 L80,80 L7,84Z" fill="url(#lmglo)"/></svg><span style="font-weight:900;letter-spacing:-.04em">CORE<span style="color:#60CFFF">ON</span></span></div>
    <div class="left-tagline">Gestão inteligente <span>do início ao fim</span></div>
    <div class="left-sub">Repasse, registro e controle em uma única plataforma.</div>
    <div class="tenant-badge">
      <div class="tenant-dot"></div>
      <span id="tenant-slug-display">—</span>
    </div>
  </div>
  <div class="left-footer">© 2025 COREON · Todos os direitos reservados</div>
</div>

<!-- ── Right panel ── -->
<div class="right-panel">
  <div class="right-inner">

    <!-- Step 1: Panel selection -->
    <div id="step-panels">
      <div class="right-header">
        <h1>Painéis de acesso</h1>
        <p>Selecione seu tipo de acesso para continuar</p>
      </div>
      <div id="panels-container">
        <!-- loading skeleton -->
        <div class="loading-panels">
          <div class="skel-row"><div class="skel"></div><div class="skel"></div></div>
          <div class="skel-row"><div class="skel"></div></div>
        </div>
      </div>
      <div style="text-align:center;margin-top:2rem">
        <a href="/" style="font-size:.73rem;color:var(--t3);transition:color .15s" onmouseover="this.style.color='#475569'" onmouseout="this.style.color='#94A3B8'">← Trocar empresa</a>
      </div>
    </div>

    <!-- Step 2: Login form -->
    <div id="step-login" class="hidden">
      <button class="back-btn" onclick="backToPanels()">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
        Voltar aos painéis
      </button>
      <div class="role-badge" id="role-badge"></div>
      <div class="form-title">Bem-vindo de volta</div>

      <div class="error-box hidden" id="error-box"></div>

      <form id="login-form" onsubmit="doLogin(event)">
        <div class="form-group">
          <label>CPF</label>
          <div class="input-wrap">
            <input id="cpf" type="text" inputmode="numeric" placeholder="000.000.000-00"
                   autocomplete="username" maxlength="14" required>
          </div>
        </div>
        <div class="form-group" style="margin-bottom:1.25rem">
          <label>Senha</label>
          <div class="input-wrap">
            <input id="password" type="password" placeholder="••••••••"
                   autocomplete="current-password" required class="has-toggle">
            <button type="button" class="toggle-pw" id="toggle-pw" onclick="togglePassword()" tabindex="-1" aria-label="Mostrar senha">
              <svg id="eye-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
            </button>
          </div>
        </div>
        <button type="submit" class="btn-login" id="btn-login">Entrar</button>
      </form>
    </div>

  </div>
</div>

<script src="/js/config.js"></script>
<script src="/js/auth.js"></script>
<script>
'use strict';

function applyCustomLogo() {
  const logo = localStorage.getItem('a1_platform_logo');
  if (!logo) return;
  document.querySelectorAll('.hdr-logo svg, .left-logo svg, .auth-logo svg, .sa-logo svg').forEach(svg => {
    const img = document.createElement('img');
    img.src = logo;
    img.style.cssText = 'height:26px;width:auto;object-fit:contain;flex-shrink:0';
    svg.replaceWith(img);
  });
}

const slug = getSlugFromURL();
document.getElementById('tenant-slug-display').textContent = slug || '?';

// Already logged in? Redirect.
if (A1.token && A1.slug === slug && A1.user) {
  redirectAfterLogin(A1.user);
}

let activeRole = null; // 'gestor' | 'cca' | 'despachante'

const PANELS_DEF = [
  {
    key: 'gestor',
    label: 'Gestor',
    sub: 'Acesso completo ao painel',
    module: null,
    loginType: 'user',
    color: '#3D5CC8',
    icon: `<svg viewBox="0 0 24 24" fill="none" stroke="#3D5CC8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
      <circle cx="12" cy="7" r="4"/>
      <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
    </svg>`,
  },
  {
    key: 'cca',
    label: 'Usuário Correspondente',
    sub: 'Acesso ao painel de operações',
    module: null,
    loginType: 'partner',
    color: '#3B82F6',
    icon: `<svg viewBox="0 0 24 24" fill="none" stroke="#3B82F6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <rect x="2" y="5" width="20" height="14" rx="2"/>
      <line x1="2" y1="10" x2="22" y2="10"/>
    </svg>`,
  },
  {
    key: 'despachante',
    label: 'Despachante',
    sub: 'Acesso ao painel de registro',
    module: 'registro',
    loginType: 'partner',
    color: '#F59E0B',
    icon: `<svg viewBox="0 0 24 24" fill="none" stroke="#F59E0B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
      <polyline points="14 2 14 8 20 8"/>
      <line x1="16" y1="13" x2="8" y2="13"/>
      <line x1="16" y1="17" x2="8" y2="17"/>
      <polyline points="10 9 9 9 8 9"/>
    </svg>`,
  },
];

async function loadPanels() {
  let activeModules = [];
  if (slug) {
    try {
      const res = await fetch(A1.rpc('a1_public_tenant_info'), {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'apikey': A1_KEY, 'Authorization': `Bearer ${A1_KEY}` },
        body: JSON.stringify({ p_slug: slug })
      });
      const data = await res.json();
      activeModules = data.modules || [];
    } catch (e) { activeModules = []; }
  }

  const visible = PANELS_DEF.filter(p => !p.module || activeModules.includes(p.module));
  const container = document.getElementById('panels-container');

  if (!visible.length) {
    container.innerHTML = '<p style="color:#94a3b8;font-size:.83rem;text-align:center;padding:2rem 0">Nenhum painel disponível.</p>';
    return;
  }

  const cols = visible.length === 1 ? 1 : visible.length === 3 ? 1 : 2;
  container.innerHTML = `<div class="panels-grid" style="grid-template-columns:repeat(${cols},1fr)">` +
    visible.map(p => `
      <div class="panel-card ${p.key}" onclick="selectPanel('${p.key}')">
        <div class="panel-card-icon">${p.icon}</div>
        <div class="panel-card-title">${p.label}</div>
        <div class="panel-card-sub">${p.sub}</div>
        <div class="panel-card-arrow">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="9 18 15 12 9 6"/>
          </svg>
        </div>
      </div>`).join('') + `</div>`;
}

function selectPanel(key) {
  activeRole = key;
  const panel = PANELS_DEF.find(p => p.key === key);
  document.getElementById('step-panels').classList.add('hidden');
  document.getElementById('step-login').classList.remove('hidden');

  const badge = document.getElementById('role-badge');
  badge.className = `role-badge ${key}`;
  badge.textContent = panel.label;

  document.getElementById('cpf').value = '';
  document.getElementById('password').value = '';
  document.getElementById('error-box').classList.add('hidden');
  document.getElementById('cpf').focus();
}

function backToPanels() {
  activeRole = null;
  document.getElementById('step-login').classList.add('hidden');
  document.getElementById('step-panels').classList.remove('hidden');
}

function redirectAfterLogin(user) {
  const role = user.role;
  const type = user.type;
  if (role === 'partner' && type === 'despachante') {
    window.location.href = `/${slug}/registro`;
  } else {
    window.location.href = `/${slug}/repasse`;
  }
}

document.getElementById('cpf').addEventListener('input', e => {
  let v = e.target.value.replace(/\D/g,'').slice(0,11);
  if (v.length > 9)      v = v.replace(/(\d{3})(\d{3})(\d{3})(\d{1,2})/,'$1.$2.$3-$4');
  else if (v.length > 6) v = v.replace(/(\d{3})(\d{3})(\d{1,3})/,'$1.$2.$3');
  else if (v.length > 3) v = v.replace(/(\d{3})(\d{1,3})/,'$1.$2');
  e.target.value = v;
});

function togglePassword() {
  const input = document.getElementById('password');
  const icon  = document.getElementById('eye-icon');
  const show  = input.type === 'password';
  input.type  = show ? 'text' : 'password';
  icon.innerHTML = show
    ? `<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/>`
    : `<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>`;
}

async function doLogin(e) {
  e.preventDefault();
  const cpf = document.getElementById('cpf').value;
  const pw  = document.getElementById('password').value;
  const btn = document.getElementById('btn-login');
  const err = document.getElementById('error-box');
  const panel = PANELS_DEF.find(p => p.key === activeRole);

  err.classList.add('hidden');
  btn.disabled = true;
  btn.innerHTML = '<div class="spinner"></div> Entrando...';

  try {
    if (!slug) throw new Error('URL inválida. Acesse /empresa/login');
    let data;
    if (panel.loginType === 'user') {
      data = await a1Login(slug, cpf, pw);
    } else {
      data = await a1PartnerLogin(slug, cpf, pw);
    }
    redirectAfterLogin(A1.user || {});
  } catch (ex) {
    err.textContent  = ex.message;
    err.classList.remove('hidden');
    btn.disabled = false;
    btn.textContent  = 'Entrar';
  }
}

// Init
loadPanels();
applyCustomLogo();
</script>
</body>
</html>
