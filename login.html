<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Entrar — ALPHA ONE</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg:#f0f2f7; --card:#fff; --border:#e2e6ef; --border2:#d1d7e3;
      --t1:#0f1520; --t2:#4a5568; --t3:#8896a7; --t4:#b8c4d0;
      --shadow:0 1px 4px rgba(0,0,0,.06),0 4px 16px rgba(0,0,0,.04);
      --shadow-lg:0 8px 32px rgba(0,0,0,.1),0 24px 64px rgba(0,0,0,.07);
      --violet:#7c3aed; --radius:10px;
    }
    *{box-sizing:border-box;margin:0;padding:0}
    body{
      font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--t1);
      min-height:100vh;display:flex;align-items:center;justify-content:center;
      font-size:14px;-webkit-font-smoothing:antialiased;
    }
    input,button{font-family:inherit}
    a{text-decoration:none;color:inherit}

    /* ── Wrapper ── */
    .login-wrap{width:100%;max-width:400px;padding:1.5rem}

    /* ── Logo ── */
    .login-logo{
      text-align:center;margin-bottom:2rem;
      font-size:1.35rem;font-weight:800;letter-spacing:-.03em;color:var(--t1)
    }
    .login-logo span{color:var(--violet)}

    /* ── Tenant pill ── */
    .tenant-pill{
      display:inline-flex;align-items:center;gap:.4rem;
      background:#ede9fe;border:1px solid #ddd6fe;border-radius:99px;
      padding:.22rem .875rem;font-size:.73rem;color:#6d28d9;font-weight:600;
      margin-bottom:.875rem;
    }
    .tenant-dot{width:6px;height:6px;border-radius:50%;background:#7c3aed;flex-shrink:0}

    /* ── Card ── */
    .login-card{
      background:var(--card);border:1px solid var(--border);
      border-radius:16px;padding:2rem;
      box-shadow:var(--shadow-lg);
    }
    .login-card-top{
      height:3px;background:linear-gradient(90deg,#7c3aed,#6366f1,#3b82f6);
      border-radius:99px;margin-bottom:1.75rem;margin:-2rem -2rem 1.75rem;
      border-radius:16px 16px 0 0;
    }

    /* ── Tabs ── */
    .tab-row{
      display:flex;background:#f1f4f9;border-radius:8px;
      padding:.2rem;gap:.2rem;margin-bottom:1.5rem;
    }
    .tab{
      flex:1;padding:.42rem .75rem;text-align:center;
      font-size:.77rem;font-weight:600;color:var(--t3);
      cursor:pointer;border-radius:6px;transition:all .15s;
    }
    .tab.active{
      background:var(--card);color:var(--t1);
      box-shadow:0 1px 4px rgba(0,0,0,.1);
    }

    /* ── Form ── */
    .form-group{display:flex;flex-direction:column;gap:.28rem;margin-bottom:1rem}
    .form-group label{
      font-size:.65rem;font-weight:700;text-transform:uppercase;
      letter-spacing:.07em;color:var(--t3)
    }
    .input-wrap{position:relative;display:flex;align-items:center}
    .input-wrap input{
      width:100%;padding:.6rem .75rem;border:1px solid var(--border);
      border-radius:8px;font-size:.85rem;color:var(--t1);background:var(--card);
      transition:border-color .15s,box-shadow .15s;
    }
    .input-wrap input:focus{
      outline:none;border-color:var(--violet);
      box-shadow:0 0 0 3px rgba(124,58,237,.1);
    }
    .input-wrap input.has-toggle{padding-right:2.5rem}
    .toggle-pw{
      position:absolute;right:.65rem;background:none;border:none;
      cursor:pointer;color:var(--t4);padding:.2rem;
      display:flex;align-items:center;transition:color .15s;
    }
    .toggle-pw:hover{color:var(--t2)}

    /* ── Error ── */
    .error-box{
      background:#fef2f2;border:1px solid #fca5a5;color:#991b1b;
      border-radius:8px;padding:.55rem .75rem;font-size:.78rem;font-weight:500;
      margin-bottom:1rem;display:none;
    }

    /* ── Button ── */
    .btn-login{
      width:100%;padding:.72rem;border:none;border-radius:8px;
      background:var(--violet);color:#fff;font-size:.85rem;font-weight:700;
      cursor:pointer;transition:background .15s,transform .1s;
      display:flex;align-items:center;justify-content:center;gap:.5rem;
      margin-top:.5rem;
    }
    .btn-login:hover{background:#6d28d9}
    .btn-login:active{transform:scale(.99)}
    .btn-login:disabled{opacity:.6;cursor:default}

    /* ── Spinner ── */
    .spinner{width:15px;height:15px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .6s linear infinite;flex-shrink:0}
    @keyframes spin{to{transform:rotate(360deg)}}

    /* ── Back link ── */
    .back-link{
      display:block;text-align:center;color:var(--t3);font-size:.75rem;
      margin-top:1.25rem;transition:color .15s;
    }
    .back-link:hover{color:var(--t2)}
  </style>
</head>
<body>
<div class="login-wrap">

  <div style="text-align:center;margin-bottom:1.5rem">
    <div class="login-logo">ALPHA <span>ONE</span></div>
    <div class="tenant-pill">
      <div class="tenant-dot"></div>
      <span id="tenant-slug-display">—</span>
    </div>
  </div>

  <div class="login-card">
    <div class="login-card-top"></div>

    <div class="tab-row">
      <div class="tab active" id="tab-user"    onclick="switchTab('user')">Usuario</div>
      <div class="tab"        id="tab-partner" onclick="switchTab('partner')">Parceiro</div>
    </div>

    <div class="error-box" id="error-box"></div>

    <form id="login-form" onsubmit="doLogin(event)">
      <div class="form-group">
        <label>CPF</label>
        <div class="input-wrap">
          <input id="cpf" type="text" inputmode="numeric" placeholder="000.000.000-00"
                 autocomplete="username" maxlength="14" required>
        </div>
      </div>
      <div class="form-group" style="margin-bottom:1.25rem">
        <label>Senha</label>
        <div class="input-wrap">
          <input id="password" type="password" placeholder="••••••••"
                 autocomplete="current-password" required class="has-toggle">
          <button type="button" class="toggle-pw" id="toggle-pw" onclick="togglePassword()" tabindex="-1" aria-label="Mostrar senha">
            <svg id="eye-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
          </button>
        </div>
      </div>
      <button type="submit" class="btn-login" id="btn-login">Entrar</button>
    </form>
  </div>

  <a href="/" class="back-link">← Trocar empresa</a>
</div>

<script src="/js/config.js"></script>
<script src="/js/auth.js"></script>
<script>
'use strict';
let activeTab = 'user';
const slug = getSlugFromURL();
document.getElementById('tenant-slug-display').textContent = slug || '?';

if (A1.token && A1.slug === slug && A1.user) {
  window.location.href = `/${slug}/repasse`;
}

document.getElementById('cpf').addEventListener('input', e => {
  let v = e.target.value.replace(/\D/g,'').slice(0,11);
  if (v.length > 9)      v = v.replace(/(\d{3})(\d{3})(\d{3})(\d{1,2})/,'$1.$2.$3-$4');
  else if (v.length > 6) v = v.replace(/(\d{3})(\d{3})(\d{1,3})/,'$1.$2.$3');
  else if (v.length > 3) v = v.replace(/(\d{3})(\d{1,3})/,'$1.$2');
  e.target.value = v;
});

function switchTab(tab) {
  activeTab = tab;
  document.getElementById('tab-user').classList.toggle('active',    tab === 'user');
  document.getElementById('tab-partner').classList.toggle('active', tab === 'partner');
}

function togglePassword() {
  const input = document.getElementById('password');
  const icon  = document.getElementById('eye-icon');
  const show  = input.type === 'password';
  input.type  = show ? 'text' : 'password';
  icon.innerHTML = show
    ? `<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/>`
    : `<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>`;
}

async function doLogin(e) {
  e.preventDefault();
  const cpf = document.getElementById('cpf').value;
  const pw  = document.getElementById('password').value;
  const btn = document.getElementById('btn-login');
  const err = document.getElementById('error-box');

  err.style.display = 'none';
  btn.disabled = true;
  btn.innerHTML = '<div class="spinner"></div> Entrando...';

  try {
    if (!slug) throw new Error('URL invalida. Acesse /slug/login');
    activeTab === 'user'
      ? await a1Login(slug, cpf, pw)
      : await a1PartnerLogin(slug, cpf, pw);
    window.location.href = `/${slug}/repasse`;
  } catch (ex) {
    err.textContent  = ex.message;
    err.style.display = 'block';
    btn.disabled = false;
    btn.textContent  = 'Entrar';
  }
}
</script>
</body>
</html>
