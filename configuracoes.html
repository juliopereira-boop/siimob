<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Redirecionando...</title>
  <script src="/js/config.js"></script>
  <script>
    // Configurações was merged into repasse.html — redirect there.
    const slug = (function() {
      const m = location.pathname.match(/^\/([^/]+)/);
      return m ? m[1] : null;
    })();
    if (slug) location.replace('/' + slug + '/repasse');
    else location.replace('/');
  </script>
</head>
<body></body>
</html>
