<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CRM — SIIMOB</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <meta name="theme-color" content="#04201D">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Inter:wght@300;400;500;600;700;800;900&family=DM+Mono:wght@400;500&display=swap" media="print" onload="this.media='all'">
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=DM+Mono:wght@400;500&display=swap"></noscript>
<link rel="stylesheet" href="/css/siimob.css">
<style>
  :root{
    --bg:#F4F6F4;--card:#fff;--border:#E2E8E5;--t1:#09201D;--t2:#47615C;--t3:#6B827D;--t4:#C9D5D1;
    --blue:#3F6F9E;--green:#0E8C7F;--amber:#C87E12;--red:#B8433A;--violet:#0E8C7F;
    --radius:10px;--shadow:0 1px 4px rgba(0,0,0,.06),0 4px 16px rgba(0,0,0,.04);--shadow-lg:0 8px 32px rgba(0,0,0,.1),0 24px 64px rgba(0,0,0,.07);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;background:var(--bg);color:var(--t1);font-size:14px;-webkit-font-smoothing:antialiased}
  input,button,select,textarea{font-family:inherit}
  a{text-decoration:none;color:inherit}
  .hdr{background:var(--violet);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:.7rem 1.5rem}
  .hdr-logo{display:flex;align-items:center;gap:.6rem;font-weight:800;font-size:.95rem;letter-spacing:-.02em}
  .hdr-right{display:flex;align-items:center;gap:.8rem;font-size:.8rem}
  .btn-hdr{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.25);color:#fff;border-radius:8px;padding:.4rem .8rem;font-size:.78rem;font-weight:700;cursor:pointer}
  .btn-hdr:hover{background:rgba(255,255,255,.25)}
  .btn-hdr-primary{background:#fff;color:var(--violet)}
  .tabs-bar{background:#07312C;display:flex;gap:.2rem;padding:0 1.5rem}
  .tab-btn{color:rgba(255,255,255,.8);font-size:.82rem;font-weight:700;padding:.7rem 1rem;cursor:pointer;border-bottom:3px solid transparent;background:none;border-top:none;border-left:none;border-right:none}
  .tab-btn.active{color:#fff;border-bottom-color:#3FB8A6;background:rgba(255,255,255,.06)}
  .main{padding:1.25rem 1.5rem;max-width:1600px;margin:0 auto}
  .spinner{width:26px;height:26px;border:3px solid var(--border);border-top-color:var(--violet);border-radius:50%;animation:spin .7s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}

  .kpi-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:.75rem;margin-bottom:1.25rem}
  .kpi-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:1rem 1.15rem;box-shadow:var(--shadow);border-left:3px solid var(--blue)}
  .kpi-card.g{border-left-color:var(--green)}.kpi-card.a{border-left-color:var(--amber)}.kpi-card.v{border-left-color:var(--violet)}.kpi-card.r{border-left-color:var(--red)}
  .kpi-label{font-size:.66rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--t3);margin-bottom:.3rem}
  .kpi-value{font-size:1.5rem;font-weight:800;letter-spacing:-.03em}
  .kpi-sub{font-size:.7rem;color:var(--t3);margin-top:.15rem}

  .toolbar{display:flex;gap:.5rem;align-items:center;margin-bottom:.9rem;flex-wrap:wrap}
  .toolbar input,.toolbar select{padding:.45rem .7rem;border:1px solid var(--border);border-radius:8px;font-size:.8rem;background:var(--card)}
  .pipe-sel{font-weight:700;color:var(--violet)}
  .kanban{display:flex;gap:.7rem;overflow-x:auto;padding-bottom:1rem;align-items:flex-start}
  .k-col{width:275px;flex-shrink:0;display:flex;flex-direction:column}
  .k-col-header{display:flex;align-items:center;justify-content:space-between;padding:.55rem .7rem;border-radius:var(--radius) var(--radius) 0 0;color:#fff;font-size:.75rem;font-weight:700}
  .k-col-count{background:rgba(255,255,255,.25);border-radius:99px;padding:.08rem .45rem;font-size:.66rem;font-weight:800}
  .k-col-fin{background:#E9EEF5;padding:.3rem .6rem;font-size:.63rem;color:var(--t3);font-weight:600;display:flex;justify-content:space-between}
  .k-col-body{background:#F1F5F9;border-radius:0 0 var(--radius) var(--radius);padding:.45rem;min-height:120px;display:flex;flex-direction:column;gap:.4rem}
  .k-col-body.drag-over{background:#E2E8E5;outline:2px dashed rgba(67,97,238,.35);outline-offset:-2px}
  .lead-card{background:var(--card);border:1px solid var(--border);border-left-width:4px;border-left-style:solid;border-radius:7px;padding:.65rem .7rem;cursor:grab;box-shadow:var(--shadow)}
  .lead-card:hover{box-shadow:var(--shadow-lg);transform:translateY(-1px)}
  .lead-card.dragging{opacity:.4}
  .lead-top{display:flex;align-items:flex-start;justify-content:space-between;gap:.4rem}
  .lead-name{font-weight:700;font-size:.82rem;margin-bottom:.2rem}
  .temp{font-size:.6rem;font-weight:800;padding:.1rem .4rem;border-radius:20px;white-space:nowrap;color:#fff}
  .lead-line{font-size:.72rem;color:var(--t2);margin-bottom:.12rem;display:flex;align-items:center;gap:.3rem}
  .lead-chips{display:flex;gap:.25rem;flex-wrap:wrap;margin-top:.35rem}
  .chip{font-size:.62rem;font-weight:700;padding:.12rem .42rem;border-radius:4px;background:#eef2ff;color:#3730A3}
  .chip.src{background:#ecfeff;color:#0e7490}.chip.val{background:#dcfce7;color:#166534;font-family:'DM Mono',monospace}
  .chip.task{background:#fef9c3;color:#854d0e}.chip.task.over{background:#fee2e2;color:#b91c1c}
  .lead-foot{display:flex;justify-content:space-between;align-items:center;margin-top:.45rem;padding-top:.4rem;border-top:1px solid var(--border)}
  .lead-foot .date{font-size:.62rem;color:var(--t4);font-family:'DM Mono',monospace}
  .mini-btn{border:1px solid var(--border);border-radius:5px;background:var(--bg);color:var(--t2);font-size:.68rem;font-weight:700;padding:.18rem .5rem;cursor:pointer}
  .mini-btn:hover{background:var(--border);color:var(--t1)}
  .wa{border:none;background:#25D366;color:#fff;border-radius:5px;font-size:.68rem;font-weight:800;padding:.18rem .5rem;cursor:pointer}

  .btn{border:none;border-radius:8px;padding:.5rem .9rem;font-size:.8rem;font-weight:700;cursor:pointer}
  .btn-primary{background:var(--violet);color:#fff}.btn-primary:hover{background:#2c4196}
  .btn-ghost{background:var(--bg);border:1px solid var(--border);color:var(--t2)}
  .btn-sm{padding:.35rem .65rem;font-size:.74rem}
  .btn-danger{background:#fee2e2;color:#b91c1c}

  .modal-bg{position:fixed;inset:0;background:rgba(15,21,32,.55);display:flex;align-items:center;justify-content:center;z-index:500;padding:1.5rem}
  .modal-bg.hidden{display:none}
  .modal{background:var(--card);border-radius:14px;width:100%;max-width:640px;max-height:92vh;display:flex;flex-direction:column;box-shadow:var(--shadow-lg);overflow:hidden}
  .modal-hdr{display:flex;align-items:flex-start;justify-content:space-between;padding:1rem 1.25rem;border-bottom:1px solid var(--border)}
  .modal-title{font-size:1rem;font-weight:800}
  .modal-sub{font-size:.75rem;color:var(--t3);margin-top:.15rem}
  .modal-close{background:var(--bg);border:1px solid var(--border);border-radius:7px;width:30px;height:30px;cursor:pointer;font-size:1rem;color:var(--t3)}
  .modal-tabs{display:flex;gap:.2rem;padding:0 1.25rem;border-bottom:1px solid var(--border);flex-wrap:wrap}
  .modal-tab{padding:.6rem .8rem;font-size:.78rem;font-weight:700;color:var(--t3);cursor:pointer;border-bottom:2px solid transparent;background:none;border-top:none;border-left:none;border-right:none}
  .modal-tab.active{color:var(--violet);border-bottom-color:var(--violet)}
  .modal-body{padding:1.25rem;overflow-y:auto}
  .modal-foot{padding:.85rem 1.25rem;border-top:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
  .fgrid{display:grid;grid-template-columns:1fr 1fr;gap:.75rem}
  .fg{display:flex;flex-direction:column}.fg.full{grid-column:1/-1}
  .fg label{font-size:.66rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--t3);margin-bottom:.25rem}
  .fg input,.fg select,.fg textarea{padding:.5rem .65rem;border:1px solid var(--border);border-radius:8px;font-size:.84rem;background:var(--card)}
  .fg .chk{flex-direction:row;align-items:center;gap:.4rem;display:flex;font-size:.8rem;font-weight:600;color:var(--t2)}
  .sec-title{font-size:.66rem;font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:var(--t3);margin:1rem 0 .6rem}

  .timeline{display:flex;flex-direction:column}
  .tl-item{display:flex;gap:.7rem;padding:.55rem 0;border-bottom:1px solid var(--border)}
  .tl-item:last-child{border-bottom:none}
  .tl-dot{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.7rem;font-weight:700;flex-shrink:0;background:#eef2ff;color:#3730A3}
  .tl-desc{font-size:.8rem;line-height:1.4}.tl-meta{font-size:.68rem;color:var(--t3);margin-top:.1rem}

  .panel{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow)}
  .cfg-hub{padding:.5rem 0 1.5rem}
  .cfg-section-hdr{font-size:.62rem;font-weight:800;text-transform:uppercase;letter-spacing:.1em;color:var(--t3);margin:1.5rem 0 .7rem;display:flex;align-items:center;gap:.5rem}
  .cfg-section-hdr::after{content:'';flex:1;height:1px;background:var(--border)}
  .cfg-section-hdr:first-child{margin-top:0}
  .cfg-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:.75rem;max-width:820px}
  .cfg-hub-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:1.15rem 1rem;display:flex;flex-direction:column;align-items:flex-start;gap:.6rem;cursor:pointer;transition:all .15s;box-shadow:var(--shadow)}
  .cfg-hub-card:hover{border-color:rgba(67,97,238,.3);box-shadow:var(--shadow-lg);transform:translateY(-1px)}
  .cfg-hub-icon{width:46px;height:46px;border-radius:11px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .cfg-card-label{font-size:.82rem;font-weight:700;color:var(--t1)}
  .cfg-card-desc{font-size:.7rem;color:var(--t3);line-height:1.4}
  .cfg-view-hdr{display:flex;align-items:center;gap:.875rem;margin-bottom:1.25rem;padding-bottom:1rem;border-bottom:1px solid var(--border)}
  .cfg-back-btn{background:none;border:1px solid var(--border);border-radius:7px;padding:.3rem .75rem;font-size:.77rem;font-weight:600;cursor:pointer;color:var(--t2)}
  .cfg-view-title{font-size:.95rem;font-weight:800}
  .pt-toolbar{display:flex;align-items:center;gap:.6rem;margin-bottom:.875rem;flex-wrap:wrap}
  .pt-table{width:100%;border-collapse:collapse;font-size:.8rem}
  .pt-table th{padding:.5rem .875rem;text-align:left;font-size:.63rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--t3);border-bottom:1px solid var(--border);background:#fafbfc}
  .pt-table td{padding:.6rem .875rem;border-bottom:1px solid var(--border)}
  .pt-table tr:last-child td{border-bottom:none}
  .pt-empty{text-align:center;padding:2rem;color:var(--t3);font-size:.8rem}
  .pt-badge{font-size:.66rem;font-weight:700;padding:.15rem .5rem;border-radius:20px}
  .pt-on{background:#dcfce7;color:#166534}.pt-off{background:#fee2e2;color:#b91c1c}
  .bar-row{margin-bottom:.55rem}
  .bar-top{display:flex;justify-content:space-between;font-size:.76rem;margin-bottom:.2rem}
  .bar-track{height:8px;background:var(--bg);border-radius:5px;overflow:hidden}
  #toast-wrap{position:fixed;bottom:1.25rem;right:1.25rem;display:flex;flex-direction:column;gap:.5rem;z-index:900}
  .toast{padding:.65rem 1rem;border-radius:8px;font-size:.8rem;font-weight:600;color:#fff;box-shadow:var(--shadow-lg)}
  .toast-success{background:#0E8C7F}.toast-error{background:#B8433A}.toast-info{background:#334155}
</style>
</head>
<body>
<div id="sb-casco"></div>

<div class="main" id="conteudo">
  <div id="tab-config" style="display:none"></div>
  <div id="tab-dash" style="display:none"></div>
  <div id="tab-tarefas" style="display:none"></div>
  <!-- LISTAGEM. O quadro mostra onde o lead ESTA; a listagem mostra a carteira
       inteira de uma vez, ordenavel, com o que o gestor precisa para cobrar.
       Todo outro modulo do sistema tem as duas vistas; Leads era o unico sem. -->
  <div id="tab-lista" style="display:none">
    <div class="toolbar">
      <input type="search" id="ll-busca" placeholder="Nome, telefone, e-mail..." oninput="renderLista()">
      <select id="ll-etapa" onchange="renderLista()"><option value="">Todas as etapas</option></select>
      <select id="ll-origem" onchange="renderLista()"><option value="">Todas as origens</option></select>
      <select id="ll-corretor" onchange="renderLista()"><option value="">Todos os corretores</option></select>
      <select id="ll-temp" onchange="renderLista()">
        <option value="">Qualquer temperatura</option><option value="Quente">Quente</option>
        <option value="Morno">Morno</option><option value="Frio">Frio</option></select>
      <div style="flex:1"></div>
      <button class="btn btn-ghost btn-sm" onclick="exportarLeads()">Exportar CSV</button>
      <span id="ll-conta" style="font-size:.72rem;color:var(--t3)"></span>
    </div>
    <div class="panel" style="overflow:auto"><div id="ll-corpo"></div></div>
  </div>
  <div id="tab-funil">
    <div class="toolbar">
      <select id="pipe-sel" class="pipe-sel" onchange="onPipeChange()"></select>
      <input type="search" id="lead-search" placeholder="Buscar lead, telefone..." oninput="renderFunil()">
      <select id="lead-src-filter" onchange="renderFunil()"><option value="">Todas as origens</option></select>
      <div style="flex:1"></div>
      <span id="lead-count" style="font-size:.72rem;color:var(--t3)"></span>
    </div>
    <div class="kanban" id="kanban"><div class="spinner" style="margin:2rem"></div></div>
  </div>
</div>

<!-- New lead -->
<div class="modal-bg hidden" id="modal-new">
  <div class="modal">
    <div class="modal-hdr"><div><div class="modal-title">Novo Lead</div><div class="modal-sub">Cadastre e qualifique o lead</div></div><button class="modal-close" onclick="closeModal('modal-new')">×</button></div>
    <div class="modal-body">
      <!-- CRIAR LEAD SAO TRES CAMPOS.
           Quem cadastra lead esta com o cliente ao telefone, e o formulario
           pedia dezoito coisas antes de deixar salvar — entao o corretor
           anotava no papel e cadastrava depois, ou nao cadastrava. O resto
           continua aqui, atras de um botao: quem tem a informacao na mao
           preenche na hora; quem nao tem, salva e volta depois. -->
      <div class="fgrid">
        <div class="fg full"><label>Nome *</label><input id="n-name" placeholder="Nome do lead" autocomplete="off"></div>
        <div class="fg"><label>Telefone / WhatsApp</label><input id="n-phone" placeholder="(00) 00000-0000" inputmode="tel"></div>
        <div class="fg"><label>E-mail</label><input id="n-email" type="email" autocomplete="off"></div>
      </div>
      <button type="button" class="btn btn-ghost" id="n-mais" onclick="alternarMaisLead()"
        style="margin-top:.9rem;width:100%;justify-content:center">
        + Adicionar informações complementares</button>

      <div id="n-extra" hidden>
      <div class="sec-title">Origem e responsável</div>
      <div class="fgrid">
        <div class="fg"><label>Origem / Campanha</label><input id="n-source" list="dl-sources"></div>
        <div class="fg"><label>Corretor responsável</label><input id="n-broker" list="dl-brokers"></div>
      </div>
      <div class="sec-title">Funil</div>
      <div class="fgrid">
        <div class="fg"><label>Pipeline</label><select id="n-pipe" onchange="fillPipeStages('n-pipe','n-stage')"></select></div>
        <div class="fg"><label>Etapa inicial</label><select id="n-stage"></select></div>
      </div>
      <div class="sec-title">Qualificação</div>
      <div class="fgrid">
        <div class="fg"><label>Finalidade</label><select id="n-finalidade"><option value="">—</option><option>Compra</option><option>Locação</option><option>Investimento</option></select></div>
        <div class="fg"><label>Tipologia</label><select id="n-tipo"><option value="">—</option><option>Apartamento</option><option>Casa</option><option>Cobertura</option><option>Terreno</option><option>Comercial/Sala</option><option>Galpão</option><option>Rural</option></select></div>
        <div class="fg"><label>Dormitórios</label><input id="n-dorms" type="number" min="0"></div>
        <div class="fg"><label>Vagas</label><input id="n-vagas" type="number" min="0"></div>
        <div class="fg full"><label>Bairro / Região de interesse</label><input id="n-bairro"></div>
        <div class="fg"><label>Faixa de preço — mín (R$)</label><input id="n-preco-min" type="number" step="1000"></div>
        <div class="fg"><label>Faixa de preço — máx (R$)</label><input id="n-preco-max" type="number" step="1000"></div>
        <div class="fg"><label>Valor do negócio (R$)</label><input id="n-value" type="number" step="0.01"></div>
        <div class="fg"><label>&nbsp;</label><label class="chk"><input type="checkbox" id="n-fgts"> Possui FGTS</label></div>
        <div class="fg"><label>&nbsp;</label><label class="chk"><input type="checkbox" id="n-permuta"> Tem imóvel p/ permuta</label></div>
        <div class="fg full"><label>Observações</label><textarea id="n-obs" rows="2"></textarea></div>
      </div>
      </div><!-- /n-extra -->
    </div>
    <div class="modal-foot"><span id="n-dica" style="font-size:.7rem;color:var(--t3)">Nome basta para salvar.</span><div style="display:flex;gap:.45rem"><button class="btn btn-ghost" onclick="closeModal('modal-new')">Cancelar</button><button class="btn btn-primary" onclick="createLead()">Criar lead</button></div></div>
  </div>
</div>

<!-- Manage lead -->
<div class="modal-bg hidden" id="modal-lead">
  <div class="modal">
    <div class="modal-hdr">
      <div><div class="modal-title" id="ml-title"></div><div class="modal-sub" id="ml-sub"></div></div>
      <div style="display:flex;gap:.5rem;align-items:center">
        <!-- EM QUALQUER ETAPA. Nao ha selo de automacao no Leads e nao precisa
             haver: o dono foi explicito — de toda etapa o corretor pode abrir a
             pre-analise. Amarrar isso a uma etapa "certa" seria inventar uma
             regra de processo que o cliente nao pediu, e que ele teria de
             descobrir errando. O botao so aparece com o modulo licenciado. -->
        <button class="btn btn-primary btn-sm" id="ml-pre" style="display:none"
          onclick="criarPreAnaliseDoLead()" title="Abrir uma pré-análise já com os dados deste lead">
          Criar pré-análise</button>
        <select id="ml-stage" onchange="changeLeadStage()" style="padding:.4rem .6rem;border:1px solid var(--border);border-radius:8px;font-size:.8rem"></select>
        <button class="modal-close" onclick="closeModal('modal-lead')">×</button></div>
    </div>
    <div class="modal-tabs">
      <button class="modal-tab active" data-mt="dados" onclick="switchLeadTab('dados',this)">Dados</button>
      <button class="modal-tab" data-mt="qual" onclick="switchLeadTab('qual',this)">Qualificação</button>
      <button class="modal-tab" data-mt="prop" onclick="switchLeadTab('prop',this)">Proposta</button>
      <button class="modal-tab" data-mt="tarefa" onclick="switchLeadTab('tarefa',this)">Tarefa</button>
      <button class="modal-tab" data-mt="hist" onclick="switchLeadTab('hist',this)">Histórico</button>
    </div>
    <div class="modal-body" id="ml-body"></div>
    <div class="modal-foot"><button class="btn btn-danger btn-sm" onclick="archiveLead()">Arquivar</button><div style="display:flex;gap:.45rem"><button class="wa" style="padding:.5rem .8rem" onclick="waLead()">WhatsApp</button><button class="btn btn-ghost" onclick="closeModal('modal-lead')">Fechar</button><button class="btn btn-primary" onclick="saveLeadRouter()">Salvar</button></div></div>
  </div>
</div>

<datalist id="dl-sources"></datalist>
<datalist id="dl-brokers"></datalist>
<div id="toast-wrap"></div>

<script src="/js/config.js"></script>
<script src="/js/auth.js"></script>
<script src="/js/modulo-shell.js"></script>
<script src="/js/avisos.js"></script>
<script src="/js/cobranca-aviso.js"></script>
<script>
const G = { user:null, slug:null, stages:[], leads:[], editingId:null, editingData:null, activeMt:'dados', pipe:null, cad:{}, cadCur:null };

const DEFAULT_PIPELINES = {
  vendas: { label:'Vendas — Imóveis Prontos', stages:[
    {name:'Lead Recebido',is_initial:true,color:'#6366f1'},{name:'Contato Estabelecido',color:'#0ea5e9'},
    {name:'Imóveis Selecionados',color:'#06b6d4'},{name:'Visita Agendada',color:'#f59e0b'},
    {name:'Visita Realizada',color:'#f97316'},{name:'Proposta',color:'#8b5cf6'},
    {name:'Negociação',color:'#ec4899'},{name:'Análise de Crédito / Jurídico',color:'#a855f7'},
    {name:'Contrato Assinado — Ganho',is_final:true,color:'#22c55e'},{name:'Perdido',is_final:true,color:'#ef4444'} ]},
  lancamentos: { label:'Vendas — Lançamentos', stages:[
    {name:'Lead de Campanha',is_initial:true,color:'#6366f1'},{name:'Agendamento Stand',color:'#0ea5e9'},
    {name:'Apresentação Decorado',color:'#f59e0b'},{name:'Documentação',color:'#8b5cf6'},
    {name:'Escolha de Unidade',color:'#ec4899'},{name:'CCV Assinado — Ganho',is_final:true,color:'#22c55e'},
    {name:'Perdido',is_final:true,color:'#ef4444'} ]},
  locacao: { label:'Locação', stages:[
    {name:'Lead de Locação',is_initial:true,color:'#6366f1'},{name:'Visita',color:'#f59e0b'},
    {name:'Análise de Garantia',color:'#8b5cf6'},{name:'Confecção do Contrato',color:'#a855f7'},
    {name:'Assinado — Ativo',is_final:true,color:'#22c55e'},{name:'Perdido',is_final:true,color:'#ef4444'} ]},
};
const PIPE_ORDER = ['vendas','lancamentos','locacao'];
const INTERACTIONS = { call:'Ligação', whatsapp:'WhatsApp', email:'E-mail', visit:'Visita', note:'Anotação' };
const PROP_STAGE_RE = /proposta|documenta|garantia/i;

async function init(){
  try { G.user = a1RequireAuth(); } catch { return; }
  try { await a1RequireModule('crm'); } catch { return; }
  G.slug = A1.slug;
  // O casco e a barra de modulos vem de js/modulo-shell.js. As quatro vistas
  // de Leads sao abas DESTA pagina — trocam de div, nao de endereco —, entao
  // vao na sub-barra como acao e nao como link.
  // A vista vem do endereco, e nao de um estado so na memoria: assim o link do
  // casco, o botao voltar do navegador e um link colado no WhatsApp abrem todos
  // a mesma tela. Era o que faltava para Leads ter as tres vistas de verdade.
  const _v = { listagem:'lista', dashboard:'dash' }[new URLSearchParams(location.search).get('vista')]
           || (new URLSearchParams(location.search).get('tab') === 'dash' ? 'dash' : 'funil');
  await a1MontarShell(document.getElementById('sb-casco'), {
    ativo:'crm',
    sub:[
      // As mesmas tres vistas de todo modulo do sistema. "Tarefas" saiu: o dono
      // pediu a gestao de tarefa no calendario, e uma aba que so listava o que
      // o quadro ja mostra era uma terceira leitura do mesmo dado. As
      // configuracoes de Leads foram para Configuracoes, com o resto do
      // sistema — "tudo que for configuracao vai estar em um unico lugar".
      { rot:'Andamento', chave:'funil', ativo:_v === 'funil', acao:"switchTab('funil')" },
      { rot:'Listagem',  chave:'lista', ativo:_v === 'lista', acao:"switchTab('lista')" },
      { rot:'Dashboard', chave:'dash',  ativo:_v === 'dash',  acao:"switchTab('dash')" }
    ],
    acoes:'<button class="sb-btn sb-btn-forte sb-btn-p" onclick="openNewLead()">+ Novo lead</button>'
  });
  // A licenca da Pre-analise decide se o caminho lead -> pre-analise existe.
  // Sem ela, o botao prometeria uma tela que o RLS recusa.
  G.temPreAnalise = await a1HasModule('PRE_ANALISE').then(r => r === true).catch(() => false);
  a1StartHeartbeat('crm');
  await loadData();
  if (_v !== 'funil') switchTab(_v);
}

async function loadData(){
  // stages, leads e cadastros (origens/corretores) são independentes — busca tudo em paralelo
  const [stagesRaw, leads] = await Promise.all([
    fetch(`${A1.rest('a1_stages')}?module_key=eq.crm&order=position.asc`, { headers:A1.headers() }).then(r=>r.json()).catch(()=>[]),
    // `select=` explicito e A1.buscarTudo nao sao zelo: sem o select, o
    // PostgREST manda TODAS as colunas, e a1_cases guarda PDF em base64
    // (attachment_pdf, attachment_doc2, legacy_docs) — um processo com dois
    // anexos vira megabytes de JSON que a tela nem usa. E sem buscarTudo o
    // corte em 1.000 acontece EM SILENCIO: a tela mostra mil e diz que sao
    // todos, que e o pior jeito de errar um numero.
    A1.buscarTudo(`${A1.rest('a1_cases')}?module_key=eq.crm&order=created_at.desc&select=id,tenant_id,module_key,stage_id,stage_name,stage_entered_at,client_name,client_cpf,client_email,client_phone,development,unit,contract_value,partner_name,broker_name,real_estate_name,payload,observations,archived,created_at,updated_at`)
      .then(r => r.linhas || []).catch(()=>[]),
    loadCad('origens'),
    loadCad('corretores')
  ]);
  let stages = stagesRaw;
  if (!Array.isArray(stages) || !stages.length) stages = await seedPipelines();
  G.stages = stages || [];
  G.leads = Array.isArray(leads) ? leads : [];
  if(!G.pipe) G.pipe = pipeKeys()[0] || 'vendas';
  populateFilters(); populatePipeSelector(); renderFunil(); refreshTaskBadge();
}

async function seedPipelines(){
  const rows=[]; let pos=0;
  PIPE_ORDER.forEach(pk=>{ DEFAULT_PIPELINES[pk].stages.forEach(s=>{ rows.push({tenant_id:G.user.tenant_id,module_key:'crm',group_key:pk,name:s.name,color:s.color,position:pos++,is_initial:!!s.is_initial,is_final:!!s.is_final}); }); });
  const created=await fetch(A1.rest('a1_stages'),{method:'POST',headers:A1.returnHeaders(),body:JSON.stringify(rows)}).then(r=>r.json()).catch(()=>[]);
  return Array.isArray(created)?created.sort((a,b)=>a.position-b.position):[];
}

function stageMap(){ return Object.fromEntries(G.stages.map(s=>[s.id,s])); }
function pipeOf(stage){ return (stage&&stage.group_key)||'geral'; }
function pipeKeys(){ const seen=[]; G.stages.forEach(s=>{const k=pipeOf(s); if(!seen.includes(k))seen.push(k);}); return seen; }
function pipeLabel(k){ return (DEFAULT_PIPELINES[k]&&DEFAULT_PIPELINES[k].label) || (k==='geral'?'Funil':k); }
function pipeStages(k){ return G.stages.filter(s=>pipeOf(s)===k); }
function leadPipe(l){ const s=stageMap()[l.stage_id]; return pipeOf(s); }

function populatePipeSelector(){
  const sel=document.getElementById('pipe-sel');
  sel.innerHTML=pipeKeys().map(k=>`<option value="${k}" ${k===G.pipe?'selected':''}>${esc(pipeLabel(k))}</option>`).join('');
}
function onPipeChange(){ G.pipe=document.getElementById('pipe-sel').value; renderFunil(); }

// ─── Lead scoring / temperatura ───────────────────────────────────────────────
function leadScore(l){
  let s=0; const q=(l.payload&&l.payload.qual)||{};
  if(l.client_phone) s+=15; if(l.client_email) s+=10; if(l.development) s+=8;
  if(q.finalidade) s+=8; if(q.tipo) s+=6; if(q.bairro) s+=8;
  if(q.preco_max||q.preco_min) s+=10; if(q.fgts) s+=10; if(q.permuta) s+=4;
  if(l.contract_value) s+=10; if(l.broker_name) s+=5; if(l.payload&&l.payload.proposta) s+=6;
  return Math.min(100,s);
}
function leadTemp(s){ return s>=70?{k:'Quente',c:'#ef4444'}:s>=40?{k:'Morno',c:'#f59e0b'}:{k:'Frio',c:'#0ea5e9'}; }

// ─── Funil ────────────────────────────────────────────────────────────────────
function filteredLeads(){
  const q=(document.getElementById('lead-search').value||'').toLowerCase();
  const src=document.getElementById('lead-src-filter').value||'';
  return G.leads.filter(l=>{
    if(l.payload&&l.payload.archived) return false;
    if(leadPipe(l)!==G.pipe) return false;
    if(src && (l.partner_name||'')!==src) return false;
    if(q){ const hay=`${l.client_name||''} ${l.client_phone||''} ${l.client_email||''} ${l.development||''} ${(l.payload&&l.payload.qual&&l.payload.qual.bairro)||''}`.toLowerCase(); if(!hay.includes(q)) return false; }
    return true;
  });
}
function taskState(l){ const t=l.payload&&l.payload.task; if(!t||!t.date) return null; const today=new Date(); today.setHours(0,0,0,0); const d=new Date(t.date+'T00:00:00'); return { over:d<today, today:d.getTime()===today.getTime(), date:t.date, desc:t.desc||'' }; }

function renderFunil(){
  const board=document.getElementById('kanban');
  const sts=pipeStages(G.pipe);
  if(!sts.length){ board.innerHTML='<div style="color:var(--t3);padding:1rem">Nenhuma etapa neste pipeline. Configure em Configurações → Funil.</div>'; return; }
  const leads=filteredLeads();
  const byStage={}; sts.forEach(s=>byStage[s.id]=[]);
  leads.forEach(l=>{ if(byStage[l.stage_id]!==undefined) byStage[l.stage_id].push(l); });
  board.innerHTML=sts.map(s=>{
    const list=byStage[s.id]||[];
    const val=list.reduce((a,l)=>a+(Number(l.contract_value)||0),0);
    return `<div class="k-col">
      <div class="k-col-header" style="background:${s.color}"><span>${esc(s.name)}</span><span class="k-col-count">${list.length}</span></div>
      <div class="k-col-fin"><span>Valor</span><b>${fmtBRL(val)}</b></div>
      <div class="k-col-body" data-stage="${s.id}" ondragover="dOver(event)" ondrop="dDrop(event,this)" ondragleave="this.classList.remove('drag-over')">
        ${list.map(leadCard).join('')}
      </div></div>`;
  }).join('');
  document.getElementById('lead-count').textContent = `${leads.length} lead${leads.length!==1?'s':''}`;
}

function leadCard(l){
  const sm=stageMap()[l.stage_id]; const sc=leadScore(l); const tp=leadTemp(sc); const ts=taskState(l);
  const phone=(l.client_phone||'').replace(/\D/g,'');
  return `<div class="lead-card" draggable="true" data-id="${l.id}" style="border-left-color:${sm?sm.color:'#6B827D'}"
    ondragstart="dStart(event,this)" ondragend="this.classList.remove('dragging')" onclick="openLead('${l.id}')">
    <div class="lead-top"><div class="lead-name">${esc(l.client_name||'Sem nome')}</div><span class="temp" style="background:${tp.c}" title="Score ${sc}/100">${tp.k} ${sc}</span></div>
    ${l.client_phone?`<div class="lead-line">📞 ${esc(l.client_phone)}</div>`:''}
    ${l.development?`<div class="lead-line">🏠 ${esc(l.development)}</div>`:''}
    <div class="lead-chips">
      ${l.partner_name?`<span class="chip src">${esc(l.partner_name)}</span>`:''}
      ${l.broker_name?`<span class="chip">${esc(l.broker_name)}</span>`:''}
      ${l.contract_value?`<span class="chip val">${fmtBRL(l.contract_value)}</span>`:''}
      ${ts?`<span class="chip task ${ts.over?'over':''}" title="${esc(ts.desc)}">⏰ ${ts.over?'atrasada':fmtDate(ts.date)}</span>`:''}
    </div>
    <div class="lead-foot"><span class="date">${fmtDate(l.created_at)}</span>
      <div style="display:flex;gap:.3rem">
        ${phone?`<button class="wa" onclick="event.stopPropagation();waTo('${phone}','${l.id}')">Zap</button>`:''}
        <button class="mini-btn" onclick="event.stopPropagation();openLead('${l.id}')">Gerenciar</button>
      </div>
    </div></div>`;
}

// ─── Drag & drop ───────────────────────────────────────────────────────────────
let dragId=null;
function dStart(e,el){ dragId=el.dataset.id; el.classList.add('dragging'); e.dataTransfer.effectAllowed='move'; }
function dOver(e){ e.preventDefault(); e.currentTarget.classList.add('drag-over'); }
function dDrop(e,el){ e.preventDefault(); el.classList.remove('drag-over'); if(dragId) moveLead(dragId,el.dataset.stage); }

async function moveLead(id,stageId){
  const l=G.leads.find(x=>x.id===id); const st=G.stages.find(s=>s.id===stageId);
  if(!l||!st||l.stage_id===stageId) return;
  const prev=stageMap()[l.stage_id];
  l.stage_id=stageId; l.stage_name=st.name; l.stage_entered_at=new Date().toISOString();
  renderFunil();
  await fetch(`${A1.rest('a1_cases')}?id=eq.${id}`,{method:'PATCH',headers:A1.headers(),body:JSON.stringify({stage_id:stageId,stage_name:st.name,stage_entered_at:l.stage_entered_at})});
  fetch(A1.rest('a1_stage_history'),{method:'POST',headers:A1.headers(),body:JSON.stringify({case_id:id,stage_id:stageId,stage_name:st.name,entered_at:l.stage_entered_at})}).catch(()=>{});
  fetch(A1.rest('a1_events'),{method:'POST',headers:A1.headers(),body:JSON.stringify({case_id:id,type:'stage_change',description:`Movido de "${prev?prev.name:'—'}" para "${st.name}"`,actor_name:G.user.name})}).catch(()=>{});
  if(PROP_STAGE_RE.test(st.name) && !(l.payload&&l.payload.proposta)) toast('Etapa de proposta: registre a proposta na aba Proposta do lead','info');
}

// ─── WhatsApp click-to-chat ─────────────────────────────────────────────────────
function waTo(phone,id){
  const digits=(phone||'').replace(/\D/g,''); if(!digits){ toast('Sem telefone','error'); return; }
  const num = digits.length<=11 ? '55'+digits : digits;
  window.open(`https://wa.me/${num}`,'_blank');
  if(id) fetch(A1.rest('a1_events'),{method:'POST',headers:A1.headers(),body:JSON.stringify({case_id:id,type:'interaction',description:'[WhatsApp] conversa iniciada',actor_name:G.user.name})}).catch(()=>{});
}
function waLead(){ const l=G.editingData||{}; waTo(l.client_phone,G.editingId); }

// ─── New lead ────────────────────────────────────────────────────────────────
function openNewLead(){
  const souCorretor = G.user?.role === 'partner' && G.user?.type === 'corretor';
  ['n-name','n-phone','n-email','n-source','n-broker','n-bairro','n-dorms','n-vagas','n-preco-min','n-preco-max','n-value','n-obs'].forEach(id=>{const el=document.getElementById(id);if(el)el.value='';});
  ['n-finalidade','n-tipo'].forEach(id=>{const el=document.getElementById(id);if(el)el.value='';});
  document.getElementById('n-fgts').checked=false; document.getElementById('n-permuta').checked=false;
  const ps=document.getElementById('n-pipe'); ps.innerHTML=pipeKeys().map(k=>`<option value="${k}">${esc(pipeLabel(k))}</option>`).join(''); ps.value=G.pipe;
  fillPipeStages('n-pipe','n-stage');
  const broker = document.getElementById('n-broker');
  if (broker) { broker.value = souCorretor ? G.user.name : ''; broker.disabled = souCorretor; }
  // A gaveta volta fechada a cada abertura: o caminho curto e o padrao, e quem
  // precisa do longo pede. Pipeline e etapa inicial ja vem escolhidos — sao a
  // primeira do cliente —, entao salvar so com o nome funciona.
  const ex = document.getElementById('n-extra'); if (ex) ex.hidden = true;
  const bt = document.getElementById('n-mais'); if (bt) bt.style.display = '';
  const dica = document.getElementById('n-dica'); if (dica) dica.textContent = 'Nome basta para salvar.';
  document.getElementById('modal-new').classList.remove('hidden');
  const nome = document.getElementById('n-name'); if (nome) setTimeout(() => nome.focus(), 60);
}
// O bloco extra abre e NAO fecha de volta: quem clicou quer preencher, e uma
// gaveta que se fecha sozinha ao clicar de novo apaga o que a pessoa digitou da
// vista sem apagar do formulario — o pior dos dois mundos.
function alternarMaisLead(){
  const ex = document.getElementById('n-extra');
  const bt = document.getElementById('n-mais');
  if (!ex) return;
  ex.hidden = false;
  if (bt) bt.style.display = 'none';
  const dica = document.getElementById('n-dica');
  if (dica) dica.textContent = 'Preencha só o que você já tem. O resto entra depois, pelo lead.';
  const p = document.getElementById('n-source');
  if (p) p.focus();
}

function fillPipeStages(pipeSelId,stageSelId){
  const pk=document.getElementById(pipeSelId).value;
  const sts=pipeStages(pk); const initials=sts.filter(s=>s.is_initial);
  document.getElementById(stageSelId).innerHTML=(initials.length?initials:sts).map(s=>`<option value="${s.id}">${esc(s.name)}</option>`).join('');
}
function qualFromForm(p){ return {
  finalidade:val(p+'finalidade'),tipo:val(p+'tipo'),dorms:val(p+'dorms'),vagas:val(p+'vagas'),
  bairro:val(p+'bairro'),preco_min:val(p+'preco-min'),preco_max:val(p+'preco-max'),
  fgts:document.getElementById(p+'fgts').checked,permuta:document.getElementById(p+'permuta').checked };
}
async function createLead(){
  const name=val('n-name'); if(!name){ toast('Informe o nome do lead','error'); return; }
  const stageId=document.getElementById('n-stage').value; const st=G.stages.find(s=>s.id===stageId);
  const body={ tenant_id:G.user.tenant_id, module_key:'crm', client_name:name, client_phone:val('n-phone'), client_email:val('n-email'),
    development:val('n-bairro')?val('n-bairro'):'', partner_name:val('n-source'), broker_name:(G.user?.role==='partner' && G.user?.type==='corretor') ? G.user.name : val('n-broker'),
    contract_value:parseFloat(val('n-value'))||null, observations:val('n-obs'),
    stage_id:stageId||null, stage_name:st?st.name:null, is_new:true, payload:{ qual:qualFromForm('n-') } };
  const res=await fetch(A1.rest('a1_cases'),{method:'POST',headers:A1.returnHeaders(),body:JSON.stringify(body)});
  const data=await res.json().catch(()=>null); const created=Array.isArray(data)?data[0]:null;
  if(created&&created.id){
    G.leads.unshift(created);
    if(stageId) fetch(A1.rest('a1_stage_history'),{method:'POST',headers:A1.headers(),body:JSON.stringify({case_id:created.id,stage_id:stageId,stage_name:st?st.name:null,entered_at:new Date().toISOString()})}).catch(()=>{});
    closeModal('modal-new'); populateFilters(); renderFunil(); toast('Lead criado','success');
  } else toast('Erro ao criar lead','error');
}

// ─── Manage lead ───────────────────────────────────────────────────────────────
function openLead(id){
  const l=G.leads.find(x=>x.id===id); if(!l) return;
  G.editingId=id; G.editingData={...l, payload:{...(l.payload||{})}};
  document.getElementById('ml-title').textContent=l.client_name||'Lead';
  const sc=leadScore(l); document.getElementById('ml-sub').textContent=`${pipeLabel(leadPipe(l))} · Score ${sc}/100 (${leadTemp(sc).k})`;
  const sts=pipeStages(leadPipe(l));
  document.getElementById('ml-stage').innerHTML=sts.map(s=>`<option value="${s.id}" ${s.id===l.stage_id?'selected':''}>${esc(s.name)}</option>`).join('');
  document.querySelectorAll('#modal-lead .modal-tab').forEach(t=>t.classList.remove('active'));
  document.querySelector('#modal-lead .modal-tab[data-mt="dados"]').classList.add('active');
  G.activeMt='dados'; renderLeadDados();
  const bp = document.getElementById('ml-pre');
  if (bp) bp.style.display = G.temPreAnalise ? '' : 'none';
  document.getElementById('modal-lead').classList.remove('hidden');
}
// O lead vira pre-analise pelo assistente da PROPRIA Pre-analise, levando o que
// ja se sabe no endereco. Criar a linha daqui exigiria repetir aqui as regras
// de permissao, a regra-mae de criacao avulsa e a escolha da situacao inicial —
// tres coisas que aquela tela ja faz, e que divergiriam no primeiro ajuste.
function criarPreAnaliseDoLead(){
  const l = G.editingData || G.leads.find(x => x.id === G.editingId);
  if (!l) return;
  const q = new URLSearchParams({ lead: l.id, nome: l.client_name || '' });
  if (l.client_phone) q.set('tel', l.client_phone);
  if (l.client_email) q.set('email', l.client_email);
  if (l.client_cpf)   q.set('cpf', l.client_cpf);
  if (l.unit)         q.set('unidade', l.unit);
  location.href = `/${G.slug}/pre-analise?${q.toString()}`;
}

function switchLeadTab(t,el){ document.querySelectorAll('#modal-lead .modal-tab').forEach(x=>x.classList.remove('active')); el.classList.add('active'); G.activeMt=t;
  if(t==='dados') renderLeadDados(); else if(t==='qual') renderLeadQual(); else if(t==='prop') renderLeadProp(); else if(t==='tarefa') renderLeadTask(); else renderLeadHist(); }

async function loadInteractions(){
  const cid=G.editingId;
  const [stages,evts]=await Promise.all([
    fetch(`${A1.rest('a1_stage_history')}?case_id=eq.${cid}&order=entered_at.asc`,{headers:A1.headers()}).then(r=>r.json()).catch(()=>[]),
    fetch(`${A1.rest('a1_events')}?case_id=eq.${cid}&order=created_at.asc`,{headers:A1.headers()}).then(r=>r.json()).catch(()=>[])
  ]);
  const items=[]; const l=G.editingData||{};
  if(l.created_at) items.push({ts:l.created_at,icon:'+',desc:'<b>Lead cadastrado</b>',meta:l.partner_name?`origem: ${esc(l.partner_name)}`:''});
  (Array.isArray(stages)?stages:[]).forEach(h=>items.push({ts:h.entered_at,icon:'⇢',desc:`Entrou em <b>${esc(h.stage_name||'')}</b>`,meta:''}));
  (Array.isArray(evts)?evts:[]).forEach(ev=>{ if(ev.type==='stage_change') return; items.push({ts:ev.created_at,icon:'•',desc:esc(ev.description||''),meta:esc(ev.actor_name||'')}); });

async function patchLead(patch, eventDesc){
  const id=G.editingId; if(!id) return false;
  const res=await fetch(`${A1.rest('a1_cases')}?id=eq.${id}`,{method:'PATCH',headers:A1.headers(),body:JSON.stringify(patch)});
  if(!res.ok){ toast('Erro ao salvar','error'); return false; }
  const idx=G.leads.findIndex(l=>l.id===id); if(idx>-1) G.leads[idx]={...G.leads[idx],...patch};
  if(patch.payload) G.editingData.payload=patch.payload;
  if(eventDesc) fetch(A1.rest('a1_events'),{method:'POST',headers:A1.headers(),body:JSON.stringify({case_id:id,type:'edit',description:eventDesc,actor_name:G.user.name})}).catch(()=>{});
  return true;
}

/* ─── Listagem ─────────────────────────────────────────────────────────────
   A carteira inteira numa tabela. O quadro responde "onde esta cada lead"; a
   listagem responde "o que eu tenho na mao" — e e nela que se cobra, se ordena
   por valor e se exporta. Todo modulo do sistema tem as duas vistas.

   Ordena no navegador de proposito: a lista ja esta carregada para o quadro, e
   uma segunda ida ao servidor para reordenar o que esta na memoria seria
   trabalho a mais para dar a mesma resposta.                                 */

const LL = { ord:'created_at', desc:true };

function popularFiltrosLista(){
  const leads = G.leads.filter(l => !(l.payload && l.payload.archived));
  const enche = (id, lista, atual) => {
    const el = document.getElementById(id); if (!el) return;
    const v = atual != null ? atual : el.value;
    const rotulo = el.options[0] ? el.options[0].textContent : '';
    el.innerHTML = `<option value="">${esc(rotulo)}</option>` +
      lista.map(x => `<option value="${esc(x)}">${esc(x)}</option>`).join('');
    el.value = v;
  };
  enche('ll-etapa',    [...new Set(G.stages.map(s => s.name).filter(Boolean))]);
  enche('ll-origem',   [...new Set(leads.map(l => l.partner_name).filter(Boolean))].sort());
  enche('ll-corretor', [...new Set(leads.map(l => l.broker_name).filter(Boolean))].sort());
}

function leadsDaLista(){
  const q = (document.getElementById('ll-busca')?.value || '').trim().toLowerCase();
  const et = document.getElementById('ll-etapa')?.value || '';
  const or = document.getElementById('ll-origem')?.value || '';
  const co = document.getElementById('ll-corretor')?.value || '';
  const tp = document.getElementById('ll-temp')?.value || '';
  const sm = stageMap();
  return G.leads.filter(l => {
    if (l.payload && l.payload.archived) return false;
    if (et && (sm[l.stage_id] || {}).name !== et) return false;
    if (or && (l.partner_name || '') !== or) return false;
    if (co && (l.broker_name || '') !== co) return false;
    if (tp && leadTemp(leadScore(l)).k !== tp) return false;
    if (q) {
      const alvo = [l.client_name, l.client_phone, l.client_email, l.development]
        .filter(Boolean).join(' ').toLowerCase();
      if (!alvo.includes(q)) return false;
    }
    return true;
  });
}

function ordenarLista(col){
  if (LL.ord === col) LL.desc = !LL.desc; else { LL.ord = col; LL.desc = true; }
  renderLista();
}

function renderLista(){
  const alvo = document.getElementById('ll-corpo');
  if (!alvo) return;
  const sm = stageMap();
  const linhas = leadsDaLista().slice().sort((a,b) => {
    const val = l => {
      switch (LL.ord) {
        case 'nome':  return (l.client_name || '').toLowerCase();
        case 'etapa': return ((sm[l.stage_id] || {}).position ?? 99);
        case 'score': return leadScore(l);
        case 'valor': return Number(l.contract_value) || 0;
        case 'corretor': return (l.broker_name || '').toLowerCase();
        default: return l.created_at || '';
      }
    };
    const x = val(a), y = val(b);
    if (x === y) return 0;
    return (x > y ? 1 : -1) * (LL.desc ? -1 : 1);
  });

  const conta = document.getElementById('ll-conta');
  if (conta) conta.textContent = `${linhas.length} de ${G.leads.length} lead(s)`;

  if (!linhas.length){
    alvo.innerHTML = `<div style="padding:2.4rem;text-align:center;color:var(--t3);font-size:.8rem">
      Nenhum lead com esses filtros. Limpe a busca ou crie o primeiro pelo botão do cabeçalho.</div>`;
    return;
  }

  const seta = c => LL.ord === c ? (LL.desc ? ' ↓' : ' ↑') : '';
  const cab = [['nome','Lead'],['etapa','Etapa'],['score','Temperatura'],
               ['valor','Valor'],['corretor','Corretor'],['created_at','Entrou em']];
  alvo.innerHTML = `<table class="pt-table" style="width:100%">
    <thead><tr>${cab.map(([c,r]) =>
      `<th style="cursor:pointer;white-space:nowrap" onclick="ordenarLista('${c}')">${esc(r)}${seta(c)}</th>`).join('')}
      <th style="width:1%"></th></tr></thead>
    <tbody>${linhas.map(l => {
      const st = sm[l.stage_id] || {};
      const sc = leadScore(l), tp = leadTemp(sc);
      const ts = taskState(l);
      const fone = (l.client_phone || '').replace(/\D/g,'');
      return `<tr style="cursor:pointer" onclick="openLead('${esc(l.id)}')">
        <td><b>${esc(l.client_name || 'Sem nome')}</b>
          <div style="font-size:.69rem;color:var(--t3)">${
            [l.client_phone, l.client_email].filter(Boolean).map(esc).join(' · ') || '—'}</div></td>
        <td><span class="chip" style="background:${esc(st.color || '#6B827D')}22;color:${esc(st.color || '#6B827D')}">${esc(st.name || '—')}</span>
          ${ts ? `<div style="font-size:.66rem;color:${ts.over ? 'var(--red)' : 'var(--t3)'}">⏰ ${ts.over ? 'tarefa atrasada' : fmtDate(ts.date)}</div>` : ''}</td>
        <td><span class="temp" style="background:${tp.c}">${tp.k} ${sc}</span></td>
        <td style="white-space:nowrap">${l.contract_value ? `<b>${fmtBRL(l.contract_value)}</b>` : '—'}</td>
        <td>${esc(l.broker_name || '—')}</td>
        <td style="white-space:nowrap;color:var(--t3)">${fmtDate(l.created_at)}</td>
        <td style="white-space:nowrap;text-align:right">${
          fone ? `<button class="wa" onclick="event.stopPropagation();waTo('${esc(fone)}','${esc(l.id)}')">Zap</button> ` : ''}
          <button class="mini-btn" onclick="event.stopPropagation();openLead('${esc(l.id)}')">Abrir</button></td>
      </tr>`;
    }).join('')}</tbody></table>`;
}

// CSV do que esta na tela, e nao da tabela inteira: o gestor exporta o recorte
// que acabou de montar com os filtros. Exportar tudo ignorando o filtro e o
// jeito de entregar uma planilha que ninguem pediu.
function exportarLeads(){
  const sm = stageMap();
  const linhas = leadsDaLista();
  if (!linhas.length){ toast('Nada para exportar com esses filtros','info'); return; }
  const cols = ['Lead','Telefone','E-mail','Etapa','Score','Temperatura','Valor','Origem','Corretor','Entrou em'];
  const escCsv = v => `"${String(v == null ? '' : v).replace(/"/g,'""')}"`;
  const corpo = linhas.map(l => {
    const sc = leadScore(l);
    return [l.client_name, l.client_phone, l.client_email, (sm[l.stage_id]||{}).name,
            sc, leadTemp(sc).k, l.contract_value || '', l.partner_name, l.broker_name,
            fmtDate(l.created_at)].map(escCsv).join(';');
  });
  // BOM na frente: sem ele o Excel em portugues abre acento como caractere
  // quebrado, e o gestor conclui que o sistema gravou errado.
  const csv = '\ufeff' + [cols.map(escCsv).join(';')].concat(corpo).join('\r\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv], { type:'text/csv;charset=utf-8' }));
  a.download = `leads-${new Date().toISOString().slice(0,10)}.csv`;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}

// ─── Dashboard ───────────────────────────────────────────────────────────────
//
// O QUE ESTE PAINEL RESPONDE
// Um funil de leads só tem três perguntas de verdade, e o painel antigo não
// respondia nenhuma: (1) estou recebendo lead? (2) estou ATENDENDO o que
// recebo? (3) o que entra vira negócio, e em quanto tempo?
//
// Quantidade sozinha engana. "120 leads" é ótimo e é péssimo, e a diferença
// está em quantos ninguém tocou, quantos passaram do prazo de contato e quanto
// tempo o funil leva para fechar. É isso que está aqui.
//
// O RECORTE É POR SAFRA DE ENTRADA, e o seletor diz qual. Misturar lead de
// ontem com lead de um ano atrás numa taxa de conversão dá um número que sobe
// sozinho conforme o cliente envelhece.

const DASH = { dias: 30 };
function dashPeriodo(d){ DASH.dias = Number(d) || 0; renderDash(); }

// Sem primeiro contato registrado e sem tarefa marcada, ninguém pegou o lead.
// É o KPI mais importante da tela: lead sem dono é dinheiro parado na porta.
function leadSemToque(l){
  const p = l.payload || {};
  return !p.task && !p.primeiro_contato && !l.broker_name;
}
function horasDesde(iso){
  const t = iso ? new Date(iso).getTime() : NaN;
  return isNaN(t) ? null : (Date.now() - t) / 36e5;
}

function renderDash(){
  const el = document.getElementById('tab-dash');
  const sm = stageMap();
  const todos = G.leads.filter(l => !(l.payload && l.payload.archived));
  const corte = DASH.dias ? Date.now() - DASH.dias * 864e5 : 0;
  const safra = DASH.dias ? todos.filter(l => new Date(l.created_at).getTime() >= corte) : todos;

  const fim     = l => (sm[l.stage_id] || {}).is_final;
  const isGanho = l => { const st = sm[l.stage_id]; return st && st.is_final && /ganho|ativo|assinad|convertid/i.test(st.name || ''); };
  const isPerd  = l => { const st = sm[l.stage_id]; return st && st.is_final && /perdid|descart|sem interesse/i.test(st.name || ''); };

  const abertos  = todos.filter(l => !fim(l));
  const ganhos   = safra.filter(isGanho);
  const perdidos = safra.filter(isPerd);
  const decididos = ganhos.length + perdidos.length;

  const vgv         = ganhos.reduce((a,l) => a + (Number(l.contract_value) || 0), 0);
  const valorAberto = abertos.reduce((a,l) => a + (Number(l.contract_value) || 0), 0);
  const ticket      = ganhos.length ? vgv / ganhos.length : null;

  // Conversão sobre quem JÁ FOI DECIDIDO, não sobre todo mundo. Dividir pelos
  // leads totais conta como "perda" quem ainda está em negociação, e faz a taxa
  // parecer pior quanto mais leads novos entram — exatamente ao contrário.
  const conv = decididos ? ganhos.length / decididos : null;

  const semToque = abertos.filter(leadSemToque);
  const parados  = abertos.filter(l => { const h = horasDesde(l.stage_entered_at || l.created_at); return h != null && h > 7*24; });
  const tarefaAtrasada = abertos.filter(l => { const t = taskState(l); return t && t.over; });

  // Ciclo: da entrada até cair numa etapa final. Só quem fechou tem ciclo.
  const ciclos = ganhos.map(l => {
    const a = new Date(l.created_at).getTime();
    const b = new Date(l.updated_at || l.stage_entered_at || l.created_at).getTime();
    return isNaN(a) || isNaN(b) || b < a ? null : (b - a) / 864e5;
  }).filter(v => v != null).sort((x,y) => x - y);
  const cicloMed = ciclos.length ? ciclos[Math.floor(ciclos.length/2)] : null;

  // Entrada por semana, das últimas 8 — a resposta à pergunta "estou recebendo".
  const semanas = [];
  for (let k = 7; k >= 0; k--){
    const de  = Date.now() - (k+1) * 7 * 864e5;
    const ate = Date.now() - k * 7 * 864e5;
    semanas.push({ n: todos.filter(l => { const t = new Date(l.created_at).getTime();
                                          return t >= de && t < ate; }).length,
                   rot: new Date(ate).toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'}) });
  }
  const topoSem = Math.max(1, ...semanas.map(x => x.n));

      <div class="sb-kpi-sub">${esc(sub)}</div></div>`;

  const degraus = sts.map(st => ({
    nome: st.name, cor: st.color || '#0E8C7F',
    n: safra.filter(l => leadPassouPor(l, st, sm)).length
  }));

    if (isGanho(l)) { rank[b].ganho++; rank[b].vgv += Number(l.contract_value) || 0; }
    if (leadSemToque(l) && !fim(l)) rank[b].sem++;
  });

      ${kpi('Ciclo até o ganho', dia(cicloMed), ciclos.length ? 'mediana de ' + ciclos.length : 'sem ganho na safra', 'info',
            'Mediana de dias entre a entrada do lead e o fechamento. A mediana, e não a média: um negócio de um ano puxa a média e não representa ninguém.')}
      ${kpi('VGV ganho', fmtBRL(vgv), ganhos.length + ' negócio(s)', 'marca')}

    </div>

function isGanhoNome(n){ return /ganho|ativo|assinad|convertid/i.test(n || ''); }
// Um lead "passou por" uma etapa se está nela ou numa posterior. Contar só quem
// está PARADO em cada etapa desenha um funil que não é funil — quem já avançou
// sumiria dos degraus de trás e o gráfico alargaria no meio.
function leadPassouPor(l, st, sm){
  const atual = sm[l.stage_id];
  if (!atual) return false;
  return (atual.position ?? 0) >= (st.position ?? 0);
}

async function loadCad(k){
  const rows=await fetch(`${A1.rest('a1_config')}?key=eq.${cadConfigKey(k)}&select=value`,{headers:A1.headers()}).then(r=>r.json()).catch(()=>[]);
  let list=[]; try{ list=JSON.parse(rows&&rows[0]&&rows[0].value||'[]'); }catch{ list=[]; }
  G.cad[k]=Array.isArray(list)?list:[]; return G.cad[k];
}

}

  const el=document.getElementById('cfg-view'); el.style.display='';
  const hdr=(t)=>`<div class="cfg-view-hdr"><button class="cfg-back-btn" onclick="closeCfgView()">← Configurações</button><div class="cfg-view-title">${t}</div></div>`;
  if(view==='funil'){
    el.innerHTML=hdr('Funis / Pipelines')+`
      <div class="pt-toolbar"><label style="font-size:.72rem;font-weight:700;color:var(--t3)">Pipeline</label><select id="cfg-pipe" onchange="renderStageList()">${pipeKeys().map(k=>`<option value="${k}" ${k===G.pipe?'selected':''}>${esc(pipeLabel(k))}</option>`).join('')}</select><div style="flex:1"></div><button class="btn btn-primary btn-sm" onclick="addStage()">+ Nova etapa</button></div>
      <div id="cfg-stages"></div>
      <div style="font-size:.72rem;color:var(--t3);margin-top:.75rem">Marque <b>Inicial</b> onde os leads entram e <b>Final</b> nas etapas de fechamento (ganho/perdido).</div>`;
    renderStageList(); return;
  }
  const def=cadDef(view); if(!def){ closeCfgView(); return; }
  G.cadCur=view;
  el.innerHTML=hdr(def.label)+`
    <div class="pt-toolbar"><div style="flex:1;font-size:.78rem;color:var(--t3)">${def.desc}</div><button class="btn btn-primary btn-sm" onclick="cadEdit(null)">+ Novo</button></div>
    <div id="cad-editor"></div>
    <div class="panel" style="overflow:hidden;margin-top:.6rem"><table class="pt-table"><thead><tr>${def.fields.slice(0,3).map(f=>`<th>${f.label}</th>`).join('')}<th>Status</th><th></th></tr></thead><tbody id="cad-tbody"><tr><td colspan="9" class="pt-empty">Carregando...</td></tr></tbody></table></div>`;
  loadCad(view).then(renderCadList);
}
function closeCfgView(){ document.getElementById('cfg-view').style.display='none'; document.getElementById('cfg-hub').style.display=''; }

function renderCadList(){
  const def=cadDef(G.cadCur); const tb=document.getElementById('cad-tbody'); if(!tb) return;
  const list=getCad(G.cadCur); const cols=def.fields.slice(0,3);
  if(!list.length){ tb.innerHTML='<tr><td colspan="9" class="pt-empty">Nenhum item cadastrado.</td></tr>'; return; }
  tb.innerHTML=list.map(it=>{ const on=it.active!==false; return `<tr>
    ${cols.map(f=> f.type==='color'
      ? `<td><span style="display:inline-block;width:14px;height:14px;border-radius:3px;background:${esc(it.color||'#ccc')};vertical-align:middle;margin-right:.35rem"></span>${esc(it.name||'')}</td>`
      : `<td>${esc(it[f.k]||'')||'—'}</td>`).join('')}
    <td><span class="pt-badge ${on?'pt-on':'pt-off'}">${on?'Ativo':'Inativo'}</span></td>
    <td style="text-align:right;white-space:nowrap"><button class="mini-btn" onclick="cadEdit('${it.id}')">Editar</button> <button class="mini-btn" onclick="cadToggle('${it.id}')">${on?'Desativar':'Ativar'}</button> <button class="mini-btn" style="color:var(--red)" onclick="cadDel('${it.id}')">Excluir</button></td></tr>`;}).join('');
}
async function cadEdit(id){
  const def=cadDef(G.cadCur);
  for(const f of def.fields){ if(f.type==='ref' && !G.cad[f.ref]) await loadCad(f.ref); } // carrega cadastros referenciados
  const it=id?getCad(G.cadCur).find(x=>x.id===id)||{}:{};
  document.getElementById('cad-editor').innerHTML=`<div class="panel" style="padding:1rem;margin-bottom:.5rem"><div class="fgrid">${def.fields.map(f=>{
    const v=it[f.k]!=null?it[f.k]:'';
    if(f.type==='textarea') return `<div class="fg full"><label>${f.label}</label><textarea id="cad-f-${f.k}" rows="3">${esc(v)}</textarea></div>`;
    if(f.type==='select') return `<div class="fg"><label>${f.label}</label><select id="cad-f-${f.k}"><option value="">—</option>${(f.options||[]).map(o=>`<option ${v===o?'selected':''}>${o}</option>`).join('')}</select></div>`;
    if(f.type==='ref'){ const opts=getCad(f.ref).filter(x=>x.active!==false).map(x=>x.name); return `<div class="fg"><label>${f.label}</label><select id="cad-f-${f.k}"><option value="">—</option>${opts.map(o=>`<option ${v===o?'selected':''}>${esc(o)}</option>`).join('')}</select></div>`; }
    if(f.type==='color') return `<div class="fg"><label>${f.label}</label><input id="cad-f-${f.k}" type="color" value="${esc(v||'#7c3aed')}" style="height:38px;padding:.2rem"></div>`;
    return `<div class="fg"><label>${f.label}${f.req?' *':''}</label><input id="cad-f-${f.k}" value="${esc(v)}"></div>`;
  }).join('')}</div><div style="margin-top:.75rem;display:flex;gap:.45rem"><button class="btn btn-primary btn-sm" onclick="cadSave('${id||''}')">Salvar</button><button class="btn btn-ghost btn-sm" onclick="document.getElementById('cad-editor').innerHTML=''">Cancelar</button></div></div>`;
}
async function cadSave(id){
  const def=cadDef(G.cadCur); const obj={};
  for(const f of def.fields){ const el=document.getElementById('cad-f-'+f.k); obj[f.k]=el?String(el.value).trim():''; }
  const pk=def.fields[0].k;
  if(def.fields[0].req && !obj[pk]){ toast('Preencha os campos obrigatórios','error'); return; }
  if(!G.cad[G.cadCur]) G.cad[G.cadCur]=[];
  if(id){ const it=G.cad[G.cadCur].find(x=>x.id===id); if(it) Object.assign(it,obj); }
  else { obj.id='i'+Date.now().toString(36)+Math.random().toString(36).slice(2,6); obj.active=true; G.cad[G.cadCur].push(obj); }
  await saveCad(G.cadCur); document.getElementById('cad-editor').innerHTML=''; renderCadList(); toast('Salvo','success');
}
async function cadToggle(id){ const it=getCad(G.cadCur).find(x=>x.id===id); if(!it) return; it.active=it.active===false; await saveCad(G.cadCur); renderCadList(); }
async function cadDel(id){ if(!confirm('Excluir este item?')) return; G.cad[G.cadCur]=getCad(G.cadCur).filter(x=>x.id!==id); await saveCad(G.cadCur); renderCadList(); toast('Removido','info'); }

function renderStageList(){
  const pk=document.getElementById('cfg-pipe')?document.getElementById('cfg-pipe').value:G.pipe;
  const box=document.getElementById('cfg-stages'); if(!box) return;
  const list=pipeStages(pk);
  if(!list.length){ box.innerHTML='<div style="color:var(--t3);font-size:.8rem">Nenhuma etapa.</div>'; return; }
  box.innerHTML=list.map((s,i)=>`
    <div style="display:flex;align-items:center;gap:.55rem;background:var(--card);border:1px solid var(--border);border-left:4px solid ${s.color||'#64748b'};border-radius:10px;padding:.55rem .7rem;margin-bottom:.5rem">
      <input type="color" value="${s.color||'#64748b'}" onchange="updateStage('${s.id}','color',this.value)" style="width:32px;height:32px;border:none;background:none;cursor:pointer;flex-shrink:0">
      <input value="${esc(s.name)}" onblur="updateStage('${s.id}','name',this.value)" style="flex:1;min-width:120px;padding:.45rem .6rem;border:1px solid var(--border);border-radius:8px;font-size:.84rem;font-weight:600">
      <label style="font-size:.7rem;font-weight:700;color:var(--t2);display:flex;align-items:center;gap:.25rem"><input type="checkbox" ${s.is_initial?'checked':''} onchange="updateStage('${s.id}','is_initial',this.checked)">Inicial</label>
      <label style="font-size:.7rem;font-weight:700;color:var(--t2);display:flex;align-items:center;gap:.25rem"><input type="checkbox" ${s.is_final?'checked':''} onchange="updateStage('${s.id}','is_final',this.checked)">Final</label>
      <button class="mini-btn" onclick="moveStage('${pk}',${i},-1)" ${i===0?'disabled':''}>↑</button>
      <button class="mini-btn" onclick="moveStage('${pk}',${i},1)" ${i===list.length-1?'disabled':''}>↓</button>
      <button class="mini-btn" style="color:var(--red)" onclick="deleteStage('${s.id}')">✕</button>
    </div>`).join('');
}
async function addStage(){
  const pk=document.getElementById('cfg-pipe').value;
  const maxPos=Math.max(0,...G.stages.map(s=>s.position||0));
  const row={tenant_id:G.user.tenant_id,module_key:'crm',group_key:pk,name:'Nova etapa',color:'#64748b',position:maxPos+1,is_initial:false,is_final:false};
  const [created]=await fetch(A1.rest('a1_stages'),{method:'POST',headers:A1.returnHeaders(),body:JSON.stringify(row)}).then(r=>r.json()).catch(()=>[null]);
  if(created){ G.stages.push(created); G.stages.sort((a,b)=>a.position-b.position); renderStageList(); populatePipeSelector(); renderFunil(); toast('Etapa adicionada','success'); }
  else toast('Erro ao adicionar','error');
}
async function updateStage(id,field,value){
  const s=G.stages.find(x=>x.id===id); if(!s||s[field]===value) return; s[field]=value;
  const res=await fetch(`${A1.rest('a1_stages')}?id=eq.${id}`,{method:'PATCH',headers:A1.headers(),body:JSON.stringify({[field]:value})});
  if(res.ok) renderFunil(); else toast('Erro ao salvar etapa','error');
}
async function moveStage(pk,idx,dir){
  const list=pipeStages(pk); const j=idx+dir; if(j<0||j>=list.length) return;
  const a=list[idx], b=list[j]; const pa=a.position, pb=b.position; a.position=pb; b.position=pa;
  G.stages.sort((x,y)=>x.position-y.position); renderStageList(); renderFunil();
  await Promise.all([
    fetch(`${A1.rest('a1_stages')}?id=eq.${a.id}`,{method:'PATCH',headers:A1.headers(),body:JSON.stringify({position:a.position})}),
    fetch(`${A1.rest('a1_stages')}?id=eq.${b.id}`,{method:'PATCH',headers:A1.headers(),body:JSON.stringify({position:b.position})})
  ]).catch(()=>{});
}
async function deleteStage(id){
  const here=G.leads.filter(l=>l.stage_id===id && !(l.payload&&l.payload.archived)).length;
  if(here>0){ toast(`Mova os ${here} lead(s) desta etapa antes de excluir`,'error'); return; }
  if(!confirm('Excluir esta etapa?')) return;
  const res=await fetch(`${A1.rest('a1_stages')}?id=eq.${id}`,{method:'DELETE',headers:A1.headers()});
  if(res.ok||res.status===204){ G.stages=G.stages.filter(s=>s.id!==id); renderStageList(); populatePipeSelector(); renderFunil(); toast('Etapa removida','info'); }
  else toast('Erro ao remover','error');
}

// ─── Tabs / helpers ────────────────────────────────────────────────────────────
function switchTab(tab,el){
  // A barra saiu daqui: quem marca a aba ativa agora e o casco, que sabe
  // desenhar a sub-barra de qualquer modulo. `el` continua na assinatura
  // porque ainda ha chamada antiga passando o botao — e ignora-lo e melhor que
  // caçar as chamadas em mil linhas para tirar um argumento.
  if (typeof a1ShellVista === 'function') a1ShellVista(tab);
  ['funil','lista','tarefas','dash','config'].forEach(t=>{ const n=document.getElementById('tab-'+t); if(n) n.style.display = t===tab?'':'none'; });
  if(tab==='dash') renderDash();
  else if(tab==='config') renderConfig();
  else if(tab==='lista') { popularFiltrosLista(); renderLista(); }
  else if(tab==='tarefas') renderTarefas();
}
function populateFilters(){
  const cfgSrc=getCad('origens').filter(x=>x.active!==false).map(x=>x.name);
  const sources=[...new Set([...cfgSrc, ...G.leads.map(l=>l.partner_name).filter(Boolean)])].sort();
  const f=document.getElementById('lead-src-filter'); if(f) f.innerHTML='<option value="">Todas as origens</option>'+sources.map(s=>`<option value="${esc(s)}">${esc(s)}</option>`).join('');
  const ds=document.getElementById('dl-sources'); if(ds) ds.innerHTML=sources.map(s=>`<option value="${esc(s)}">`).join('');
  const brokers=[...new Set([...getCad('corretores').filter(x=>x.active!==false).map(x=>x.name), ...G.leads.map(l=>l.broker_name).filter(Boolean)])].sort();
  const db=document.getElementById('dl-brokers'); if(db) db.innerHTML=brokers.map(b=>`<option value="${esc(b)}">`).join('');
}
function closeModal(id){ document.getElementById(id).classList.add('hidden'); if(id==='modal-lead'){G.editingId=null;G.editingData=null;} }
function val(id){ const el=document.getElementById(id); return el?String(el.value).trim():''; }
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function fmtBRL(v){ return Number(v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'}); }
function fmtDate(d){ if(!d) return '—'; const x=(typeof d==='string'&&d.length===10)?new Date(d+'T00:00:00'):new Date(d); return x.toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit',year:'2-digit'}); }
function fmtDT(d){ return d?new Date(d).toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',year:'2-digit',hour:'2-digit',minute:'2-digit'}):'—'; }
function toast(msg,type='info'){ const w=document.getElementById('toast-wrap'); const d=document.createElement('div'); d.className=`toast toast-${type}`; d.textContent=msg; w.appendChild(d); setTimeout(()=>d.remove(),3200); }

// salva Qualificação/Proposta/Tarefa quando o usuário clica em "Salvar" geral estando nessas abas
async function saveLeadRouter(){ if(G.activeMt==='qual') return saveQual(); if(G.activeMt==='prop') return saveProposta(); if(G.activeMt==='tarefa') return saveTask(); return saveLead(); }

document.querySelectorAll('.modal-bg').forEach(bg=>bg.addEventListener('click',e=>{if(e.target===bg)closeModal(bg.id);}));
init();
</script>
</body>
