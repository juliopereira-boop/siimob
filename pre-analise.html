<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pré-análise — SIIMOB</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="theme-color" content="#0B534E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=DM+Mono:wght@400;500&display=swap" media="print" onload="this.media='all'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=DM+Mono:wght@400;500&display=swap"></noscript>
<style>
  :root{
    --bg:#F8FAFC;--card:#fff;--border:#e2e6ef;--t1:#0f1520;--t2:#4a5568;--t3:#8896a7;--t4:#b8c4d0;
    --blue:#2563eb;--green:#16a34a;--amber:#d97706;--red:#dc2626;--violet:#3D5CC8;
    --radius:10px;--shadow:0 1px 4px rgba(0,0,0,.06),0 4px 16px rgba(0,0,0,.04);--shadow-lg:0 8px 32px rgba(0,0,0,.1),0 24px 64px rgba(0,0,0,.07);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;background:var(--bg);color:var(--t1);font-size:14px;-webkit-font-smoothing:antialiased}
  input,button,select,textarea{font-family:inherit}
  a{text-decoration:none;color:inherit}
  /* O cabeçalho e a barra de abas vêm de js/modulo-shell.js. Redefinir .hdr,
     .tabs-bar ou .tab-btn aqui foi exatamente o que deixou esta tela torta:
     duas folhas brigando pelo mesmo seletor, e ganhava a que carregasse por
     último. Se precisar mexer na barra, mexa no shell. */
  .main{padding:1.25rem 1.5rem;max-width:1600px;margin:0 auto}
  .pg-hdr{display:flex;align-items:baseline;gap:.6rem;margin-bottom:1rem;flex-wrap:wrap}
  .pg-titulo{font-size:1.1rem;font-weight:800;letter-spacing:-.02em}
  .pg-vista{font-size:.75rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--t3)}
  .spinner{width:26px;height:26px;border:3px solid var(--border);border-top-color:var(--violet);border-radius:50%;animation:spin .7s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}

  .kpi-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(165px,1fr));gap:.75rem;margin-bottom:1.25rem}
  .kpi-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:1rem 1.15rem;box-shadow:var(--shadow);border-left:3px solid var(--blue)}
  .kpi-card.g{border-left-color:var(--green)}.kpi-card.a{border-left-color:var(--amber)}
  .kpi-card.v{border-left-color:var(--violet)}.kpi-card.r{border-left-color:var(--red)}
  .kpi-label{font-size:.66rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--t3);margin-bottom:.3rem}
  .kpi-value{font-size:1.5rem;font-weight:800;letter-spacing:-.03em}
  .kpi-sub{font-size:.7rem;color:var(--t3);margin-top:.15rem}

  .toolbar{display:flex;gap:.5rem;align-items:center;margin-bottom:.9rem;flex-wrap:wrap}
  .toolbar input,.toolbar select{padding:.45rem .7rem;border:1px solid var(--border);border-radius:8px;font-size:.8rem;background:var(--card)}
  .seg{display:flex;border:1px solid var(--border);border-radius:8px;overflow:hidden;background:var(--card)}
  .seg button{border:none;background:none;padding:.45rem .8rem;font-size:.76rem;font-weight:700;color:var(--t3);cursor:pointer}
  .seg button.on{background:var(--violet);color:#fff}

  /* ── Fila ── */
  .tbl-wrap{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);overflow:auto}
  table.fila{width:100%;border-collapse:collapse;font-size:.8rem}
  table.fila th{padding:.55rem .85rem;text-align:left;font-size:.63rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--t3);border-bottom:1px solid var(--border);background:#fafbfc;white-space:nowrap;position:sticky;top:0;z-index:2}
  table.fila td{padding:.6rem .85rem;border-bottom:1px solid var(--border);vertical-align:middle}
  table.fila tr:last-child td{border-bottom:none}
  table.fila tbody tr{cursor:pointer}
  table.fila tbody tr:hover{background:#f7f9fc}
  .cli{font-weight:700}
  .sub{font-size:.68rem;color:var(--t3)}
  .cod{font-family:'DM Mono',monospace;font-size:.72rem;color:var(--t3)}
  .sit{font-size:.66rem;font-weight:700;padding:.15rem .5rem;border-radius:20px;color:#fff;white-space:nowrap}
  .sla{display:flex;align-items:center;gap:.4rem;min-width:118px}
  .sla-track{flex:1;height:6px;background:#eef1f6;border-radius:4px;overflow:hidden}
  .sla-fill{height:100%;border-radius:4px}
  .sla-txt{font-size:.66rem;font-weight:700;font-family:'DM Mono',monospace;white-space:nowrap}
  .sla-ok .sla-fill{background:var(--green)}   .sla-ok .sla-txt{color:var(--green)}
  .sla-at .sla-fill{background:var(--amber)}   .sla-at .sla-txt{color:var(--amber)}
  .sla-ex .sla-fill{background:var(--red)}     .sla-ex .sla-txt{color:var(--red)}
  .sla-nd .sla-fill{background:var(--t4)}      .sla-nd .sla-txt{color:var(--t3)}
  .vazio{text-align:center;padding:2.5rem 1rem;color:var(--t3);font-size:.82rem}

  /* ── Esteira (kanban) ── */
  .kanban{display:flex;gap:.7rem;overflow-x:auto;padding-bottom:1rem;align-items:flex-start}
  .k-col{width:272px;flex-shrink:0;display:flex;flex-direction:column}
  .k-col-header{display:flex;align-items:center;justify-content:space-between;padding:.55rem .7rem;border-radius:var(--radius) var(--radius) 0 0;color:#fff;font-size:.75rem;font-weight:700}
  .k-col-count{background:rgba(255,255,255,.25);border-radius:99px;padding:.08rem .45rem;font-size:.66rem;font-weight:800}
  .k-col-body{background:#F1F5F9;border-radius:0 0 var(--radius) var(--radius);padding:.45rem;min-height:110px;display:flex;flex-direction:column;gap:.4rem}
  .pa-card{background:var(--card);border:1px solid var(--border);border-left-width:4px;border-left-style:solid;border-radius:7px;padding:.6rem .7rem;cursor:pointer;box-shadow:var(--shadow)}
  .pa-card:hover{box-shadow:var(--shadow-lg);transform:translateY(-1px)}
  .pa-name{font-weight:700;font-size:.82rem;margin-bottom:.15rem}
  .pa-line{font-size:.71rem;color:var(--t2);margin-bottom:.1rem}
  .chip{font-size:.62rem;font-weight:700;padding:.12rem .42rem;border-radius:4px;background:#eef2ff;color:#3730A3}
  .chip.val{background:#dcfce7;color:#166534;font-family:'DM Mono',monospace}
  .chip.w{background:#fef9c3;color:#854d0e}.chip.r{background:#fee2e2;color:#b91c1c}
  .chips{display:flex;gap:.25rem;flex-wrap:wrap;margin-top:.35rem}

  .btn{border:none;border-radius:8px;padding:.5rem .9rem;font-size:.8rem;font-weight:700;cursor:pointer}
  .btn-primary{background:var(--violet);color:#fff}.btn-primary:hover{background:#2c4196}
  .btn-ghost{background:var(--bg);border:1px solid var(--border);color:var(--t2)}
  .btn-sm{padding:.35rem .65rem;font-size:.74rem}
  .btn-danger{background:#fee2e2;color:#b91c1c}
  .btn:disabled{opacity:.45;cursor:not-allowed}

  .modal-bg{position:fixed;inset:0;background:rgba(15,21,32,.55);display:flex;align-items:center;justify-content:center;z-index:500;padding:1.5rem}
  .modal-bg.hidden{display:none}
  .modal{background:var(--card);border-radius:14px;width:100%;max-width:680px;max-height:92vh;display:flex;flex-direction:column;box-shadow:var(--shadow-lg);overflow:hidden}
  .modal.wide{max-width:900px}
  .modal-hdr{display:flex;align-items:flex-start;justify-content:space-between;padding:1rem 1.25rem;border-bottom:1px solid var(--border);gap:1rem}
  .modal-title{font-size:1rem;font-weight:800}
  .modal-sub{font-size:.75rem;color:var(--t3);margin-top:.15rem}
  .modal-close{background:var(--bg);border:1px solid var(--border);border-radius:7px;width:30px;height:30px;cursor:pointer;font-size:1rem;color:var(--t3);flex-shrink:0}
  .modal-tabs{display:flex;gap:.2rem;padding:0 1.25rem;border-bottom:1px solid var(--border);flex-wrap:wrap}
  .modal-tab{padding:.6rem .75rem;font-size:.77rem;font-weight:700;color:var(--t3);cursor:pointer;border-bottom:2px solid transparent;background:none;border-top:none;border-left:none;border-right:none}
  .modal-tab.active{color:var(--violet);border-bottom-color:var(--violet)}
  .modal-body{padding:1.25rem;overflow-y:auto}
  .modal-foot{padding:.85rem 1.25rem;border-top:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;gap:.6rem;flex-wrap:wrap}
  .fgrid{display:grid;grid-template-columns:1fr 1fr;gap:.75rem}
  .fg{display:flex;flex-direction:column}.fg.full{grid-column:1/-1}
  .fg label{font-size:.66rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--t3);margin-bottom:.25rem}
  .fg input,.fg select,.fg textarea{padding:.5rem .65rem;border:1px solid var(--border);border-radius:8px;font-size:.84rem;background:var(--card)}
  .fg .chk{flex-direction:row;align-items:center;gap:.4rem;display:flex;font-size:.8rem;font-weight:600;color:var(--t2);text-transform:none;letter-spacing:0}
  .sec-title{font-size:.66rem;font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:var(--t3);margin:1.1rem 0 .6rem}
  .sec-title:first-child{margin-top:0}

  /* passos do assistente */
  .passos{display:flex;gap:.4rem;padding:.75rem 1.25rem;background:#fafbfc;border-bottom:1px solid var(--border)}
  .passo{flex:1;display:flex;align-items:center;gap:.45rem;font-size:.72rem;font-weight:700;color:var(--t3)}
  .passo .n{width:22px;height:22px;border-radius:50%;background:#e6eaf2;color:var(--t3);display:flex;align-items:center;justify-content:center;font-size:.7rem;font-weight:800;flex-shrink:0}
  .passo.on{color:var(--violet)} .passo.on .n{background:var(--violet);color:#fff}
  .passo.ok .n{background:var(--green);color:#fff}

  .linha{display:flex;align-items:center;justify-content:space-between;gap:.6rem;padding:.55rem .7rem;border:1px solid var(--border);border-radius:8px;margin-bottom:.4rem;background:var(--card)}
  .linha .nm{font-weight:700;font-size:.82rem}
  .linha .mt{font-size:.68rem;color:var(--t3)}
  .pill{font-size:.62rem;font-weight:800;padding:.12rem .45rem;border-radius:20px;text-transform:uppercase;letter-spacing:.04em}
  .pill.ok{background:#dcfce7;color:#166534}.pill.no{background:#fee2e2;color:#b91c1c}
  .pill.wt{background:#fef9c3;color:#854d0e}.pill.nt{background:#eef2ff;color:#3730A3}

  .timeline{display:flex;flex-direction:column}
  .tl-item{display:flex;gap:.7rem;padding:.55rem 0;border-bottom:1px solid var(--border)}
  .tl-item:last-child{border-bottom:none}
  .tl-dot{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.68rem;flex-shrink:0;background:#eef2ff;color:#3730A3}
  .tl-desc{font-size:.79rem;line-height:1.4}.tl-meta{font-size:.67rem;color:var(--t3);margin-top:.1rem}

  .aviso{border-radius:9px;padding:.7rem .85rem;font-size:.78rem;line-height:1.45;margin-bottom:.9rem}
  .aviso.i{background:#eff6ff;color:#1e40af;border:1px solid #bfdbfe}
  .aviso.w{background:#fffbeb;color:#92400e;border:1px solid #fde68a}
  .aviso.e{background:#fef2f2;color:#991b1b;border:1px solid #fecaca}
  .aviso.s{background:#f0fdf4;color:#166534;border:1px solid #bbf7d0}

  #toast-wrap{position:fixed;bottom:1.25rem;right:1.25rem;display:flex;flex-direction:column;gap:.5rem;z-index:900}
  .toast{padding:.65rem 1rem;border-radius:8px;font-size:.8rem;font-weight:600;color:#fff;box-shadow:var(--shadow-lg);max-width:360px}
  .toast-success{background:#16a34a}.toast-error{background:#dc2626}.toast-info{background:#334155}
  @media(max-width:720px){ .fgrid{grid-template-columns:1fr} .main{padding:1rem .8rem} }
</style>
</head>
<body>

<div id="shell"></div>

<div class="main">

  <div class="pg-hdr">
    <h1 class="pg-titulo">Pré-análise</h1>
    <span class="pg-vista" id="pg-vista"></span>
  </div>

  <!-- KPIs e barra de filtros ficam FORA das vistas: são os mesmos números e os
       mesmos filtros nas duas, e duplicá-los era o caminho mais curto para uma
       delas parar de filtrar sem ninguém perceber. -->
  <div class="kpi-grid" id="kpis"></div>

  <div class="toolbar">
    <input type="search" id="f-busca" placeholder="Cliente, CPF, código..." oninput="renderVista()" style="min-width:220px">
    <select id="f-situacao" onchange="renderVista()"><option value="">Todas as situações</option></select>
    <select id="f-corretor" onchange="renderVista()"><option value="">Todos os corretores</option></select>
    <select id="f-empr"     onchange="renderVista()"><option value="">Todos os empreendimentos</option></select>
    <div class="seg" role="group" aria-label="Filtro de prazo">
      <button id="sla-todos"  class="on" onclick="filtrarSla('')">Todos</button>
      <button id="sla-ok"     onclick="filtrarSla('ok')">No prazo</button>
      <button id="sla-at"     onclick="filtrarSla('at')">Atenção</button>
      <button id="sla-ex"     onclick="filtrarSla('ex')">Estourado</button>
    </div>
    <div style="flex:1"></div>
    <span id="fila-contagem" style="font-size:.72rem;color:var(--t3)"></span>
  </div>

  <div id="vista-andamento" style="display:none">
    <div class="kanban" id="kanban"><div class="spinner" style="margin:2rem"></div></div>
  </div>

  <div id="vista-listagem" style="display:none">
    <div class="tbl-wrap" id="fila-wrap"><div class="spinner" style="margin:2rem"></div></div>
  </div>

</div>

<!-- ══════════ ASSISTENTE — NOVA PRÉ-ANÁLISE ══════════ -->
<div class="modal-bg hidden" id="modal-nova">
  <div class="modal">
    <div class="modal-hdr">
      <div><div class="modal-title">Nova Pré-análise</div>
           <div class="modal-sub" id="nova-sub">Passo 1 de 3 — o negócio</div></div>
      <button class="modal-close" onclick="fecharModal('modal-nova')" aria-label="Fechar">×</button>
    </div>
    <div class="passos">
      <div class="passo on" id="passo-1"><span class="n">1</span> Negócio</div>
      <div class="passo"    id="passo-2"><span class="n">2</span> Titular</div>
      <div class="passo"    id="passo-3"><span class="n">3</span> Renda</div>
    </div>
    <div class="modal-body" id="nova-body"></div>
    <div class="modal-foot">
      <button class="btn btn-ghost" id="nova-voltar" onclick="passoAnterior()" style="visibility:hidden">Voltar</button>
      <div style="display:flex;gap:.45rem">
        <button class="btn btn-ghost" onclick="fecharModal('modal-nova')">Cancelar</button>
        <button class="btn btn-primary" id="nova-avancar" onclick="passoSeguinte()">Avançar</button>
      </div>
    </div>
  </div>
</div>

<!-- ══════════ DOSSIÊ 360º ══════════ -->
<div class="modal-bg hidden" id="modal-dossie">
  <div class="modal wide">
    <div class="modal-hdr">
      <div>
        <div class="modal-title" id="dos-titulo"></div>
        <div class="modal-sub"  id="dos-sub"></div>
      </div>
      <div style="display:flex;gap:.5rem;align-items:center">
        <span id="dos-situacao"></span>
        <button class="modal-close" onclick="fecharModal('modal-dossie')" aria-label="Fechar">×</button>
      </div>
    </div>
    <div class="modal-tabs" id="dos-tabs">
      <button class="modal-tab active" data-dt="dados"   onclick="trocarAbaDossie('dados',this)">Dados</button>
      <button class="modal-tab" data-dt="pessoas"        onclick="trocarAbaDossie('pessoas',this)">Pessoas</button>
      <button class="modal-tab" data-dt="credito"        onclick="trocarAbaDossie('credito',this)">Crédito</button>
      <button class="modal-tab" data-dt="documentos"     onclick="trocarAbaDossie('documentos',this)">Documentos</button>
      <button class="modal-tab" data-dt="checklist"      onclick="trocarAbaDossie('checklist',this)">Checklist</button>
      <button class="modal-tab" data-dt="historico"      onclick="trocarAbaDossie('historico',this)">Histórico</button>
      <button class="modal-tab" data-dt="comercial"      onclick="trocarAbaDossie('comercial',this)">Comercial</button>
    </div>
    <div class="modal-body" id="dos-body"></div>
    <div class="modal-foot">
      <div id="dos-acoes" style="display:flex;gap:.45rem;flex-wrap:wrap"></div>
      <div style="display:flex;gap:.45rem;align-items:center">
        <select id="dos-mover" style="padding:.45rem .6rem;border:1px solid var(--border);border-radius:8px;font-size:.8rem"></select>
        <button class="btn btn-primary btn-sm" id="dos-btn-mover" onclick="moverSituacao()">Mover</button>
      </div>
    </div>
  </div>
</div>

<div id="toast-wrap"></div>

<script src="/js/config.js"></script>
<script src="/js/auth.js"></script>
<script src="/js/modulo-shell.js"></script>
<script src="/js/avisos.js"></script>
<script src="/js/cobranca-aviso.js"></script>
<script>
const G = {
  user:null, slug:null,
  situacoes:[], transicoes:[], lista:[], pessoas:{},
  corretores:[], imobiliarias:[], empreendimentos:[],
  filtroSla:'', abaDossie:'dados',
  atual:null, atualPart:[], atualCred:[], atualDocs:[], atualEv:[], atualCo:null,
  passo:1, rascunho:{}
};

// ─── utilitários ─────────────────────────────────────────────────────────────
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function toast(msg,tipo='info'){ const w=document.getElementById('toast-wrap'); const d=document.createElement('div'); d.className='toast toast-'+tipo; d.textContent=msg; w.appendChild(d); setTimeout(()=>d.remove(),4200); }
function fecharModal(id){ document.getElementById(id).classList.add('hidden'); }
function soDigitos(s){ return String(s||'').replace(/\D/g,''); }
const _brl = new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'});
// Dinheiro é guardado em CENTAVOS, inteiro. Guardar reais em ponto flutuante é
// como se acerta a soma do subsídio com o FGTS por um centavo e depois se
// discute com o banco de quem é o erro.
function brl(cent){ return _brl.format((Number(cent)||0)/100); }
function paraCentavos(v){ const n=Number(String(v==null?'':v).replace(/\./g,'').replace(',','.')); return isNaN(n)?null:Math.round(n*100); }
function dataBR(iso){ if(!iso) return '—'; const d=new Date(iso); return isNaN(d)?'—':d.toLocaleDateString('pt-BR'); }
function dataHoraBR(iso){ if(!iso) return '—'; const d=new Date(iso); return isNaN(d)?'—':d.toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',year:'2-digit',hour:'2-digit',minute:'2-digit'}); }
function mascaraDoc(d){ d=soDigitos(d);
  if(d.length===11) return d.replace(/(\d{3})(\d{3})(\d{3})(\d{2})/,'$1.$2.$3-$4');
  if(d.length===14) return d.replace(/(\d{2})(\d{3})(\d{3})(\d{4})(\d{2})/,'$1.$2.$3/$4-$5');
  return d; }

// CPF conferido de verdade, com os dois dígitos. Um CPF digitado errado só
// aparece semanas depois, quando o banco recusa o processo inteiro.
function cpfValido(cpf){
  cpf = soDigitos(cpf);
  if (cpf.length !== 11 || /^(\d)\1{10}$/.test(cpf)) return false;
  for (let t = 9; t < 11; t++) {
    let s = 0;
    for (let i = 0; i < t; i++) s += parseInt(cpf[i],10) * ((t + 1) - i);
    let d = (s * 10) % 11; if (d === 10) d = 0;
    if (d !== parseInt(cpf[t],10)) return false;
  }
  return true;
}

function ehGestor(){ return G.user && G.user.role !== 'partner'; }
function perm(chave){
  if (ehGestor()) return true;
  const p = (G.user && G.user.permissions) || {};
  return p.gerente === true || p[chave] === true;
}

// ─── SLA ─────────────────────────────────────────────────────────────────────
// O relógio conta a partir de quando o processo ENTROU na situação atual, não
// de quando foi criado. Um processo pode estar há 40 dias na esteira e há duas
// horas na etapa que está travando — é a segunda informação que resolve o dia.
function sla(pa){
  const s = G.situacoes.find(x => x.id === pa.situacao_id);
  const horas = s && s.sla_horas;
  const desde = pa.situacao_em || pa.criado_em;
  const decorridas = desde ? (Date.now() - new Date(desde).getTime())/3600000 : 0;
  if (!horas || horas <= 0) return { cls:'sla-nd', pct:0, txt:humano(decorridas), nivel:'nd' };
  const pct = Math.min(100, (decorridas/horas)*100);
  const nivel = pct >= 100 ? 'ex' : (pct >= 75 ? 'at' : 'ok');
  const restam = horas - decorridas;
  return { cls:'sla-'+nivel, pct, nivel,
           txt: restam >= 0 ? ('faltam ' + humano(restam)) : ('há ' + humano(-restam)) };
}
function humano(h){
  if (h < 1) return Math.max(0,Math.round(h*60)) + 'min';
  if (h < 48) return Math.round(h) + 'h';
  return Math.round(h/24) + 'd';
}

// ─── boot ────────────────────────────────────────────────────────────────────
async function init(){
  try { G.user = a1RequireAuth(); } catch { return; }
  await a1RefreshPartnerPerms(); G.user = A1.user || G.user;
  try { await a1RequireModule('PRE_ANALISE'); } catch { return; }
  G.slug = A1.slug;

  // Cabeçalho e abas vêm do shell — os mesmos de Dashboard, Repasse e Comercial.
  // O botão de criar entra como ação do cabeçalho, e não como um botão solto
  // desta tela, para não voltarmos a ter duas barras diferentes no produto.
  await a1MontarShell(document.getElementById('shell'), {
    ativo:'PRE_ANALISE', vista: a1VistaDaURL(),
    acoes: '<button class="btn-hdr btn-hdr-primary" id="btn-nova" onclick="abrirAssistente()">+ Nova Pré-análise</button>'
  });
  if (!perm('criar_repasses')) document.getElementById('btn-nova').style.display = 'none';

  aplicarVista();
  a1StartHeartbeat('pre-analise');
  await carregar();
}

async function carregar(){
  const h = { headers: A1.headers() };
  const [sit, tr, pre, corr, imob, empr] = await Promise.all([
    fetch(`${A1.rest('a1_pa_situacoes')}?ativo=is.true&order=ordem.asc`, h).then(r=>r.json()).catch(()=>[]),
    fetch(`${A1.rest('a1_pa_transicoes')}?ativo=is.true`, h).then(r=>r.json()).catch(()=>[]),
    A1.buscarTudo(`${A1.rest('a1_pre_analises')}?order=criado_em.desc`),
    fetch(`${A1.rest('a1_partners')}?type=eq.corretor&select=id,name&order=name.asc`, h).then(r=>r.json()).catch(()=>[]),
    fetch(`${A1.rest('a1_partners')}?type=eq.imobiliaria&select=id,name&order=name.asc`, h).then(r=>r.json()).catch(()=>[]),
    fetch(`${A1.rest('a1_developments')}?select=id,name&order=name.asc`, h).then(r=>r.json()).catch(()=>[])
  ]);
  G.situacoes     = Array.isArray(sit)  ? sit  : [];
  G.transicoes    = Array.isArray(tr)   ? tr   : [];
  G.lista         = (pre && Array.isArray(pre.linhas)) ? pre.linhas : [];
  G.corretores    = Array.isArray(corr) ? corr : [];
  G.imobiliarias  = Array.isArray(imob) ? imob : [];
  G.empreendimentos = Array.isArray(empr) ? empr : [];

  // Os nomes dos clientes vêm dos participantes. Uma consulta só para a fila
  // inteira, em vez de uma por linha.
  await carregarTitulares();
  preencherFiltros();
  renderVista();
}

async function carregarTitulares(){
  G.titulares = {};
  if (!G.lista.length) return;
  const ids = G.lista.map(p => p.id);
  const part = await A1.buscarTudo(
    `${A1.rest('a1_pa_participantes')}?papel=eq.TITULAR&pre_analise_id=in.(${ids.join(',')})&select=pre_analise_id,pessoa_id,renda_declarada`);
  const linhas = (part && part.linhas) || [];
  const pids = [...new Set(linhas.map(l => l.pessoa_id).filter(Boolean))];
  if (pids.length){
    const pes = await A1.buscarTudo(
      `${A1.rest('a1_pa_pessoas')}?id=in.(${pids.join(',')})&select=id,nome,documento,telefone`);
    ((pes && pes.linhas) || []).forEach(p => { G.pessoas[p.id] = p; });
  }
  linhas.forEach(l => { G.titulares[l.pre_analise_id] = G.pessoas[l.pessoa_id] || null; });
}

function preencherFiltros(){
  const fs = document.getElementById('f-situacao');
  fs.innerHTML = '<option value="">Todas as situações</option>' +
    G.situacoes.map(s => `<option value="${esc(s.id)}">${esc(s.nome)}</option>`).join('');
  const fc = document.getElementById('f-corretor');
  fc.innerHTML = '<option value="">Todos os corretores</option>' +
    G.corretores.map(c => `<option value="${esc(c.id)}">${esc(c.name)}</option>`).join('');
  const fe = document.getElementById('f-empr');
  fe.innerHTML = '<option value="">Todos os empreendimentos</option>' +
    G.empreendimentos.map(e => `<option value="${esc(e.id)}">${esc(e.name)}</option>`).join('');
}

function nomeSituacao(id){ const s = G.situacoes.find(x=>x.id===id); return s ? s.nome : '—'; }
function corSituacao(id){ const s = G.situacoes.find(x=>x.id===id); return (s && s.cor) || '#64748b'; }
function nomeCorretor(id){ const c = G.corretores.find(x=>x.id===id); return c ? c.name : '—'; }
function nomeEmpr(id){ const e = G.empreendimentos.find(x=>x.id===id); return e ? e.name : '—'; }

// ─── fila ────────────────────────────────────────────────────────────────────
function filtrarSla(n){
  G.filtroSla = n;
  ['todos','ok','at','ex'].forEach(k => {
    const b = document.getElementById('sla-'+k);
    if (b) b.classList.toggle('on', (k==='todos' ? '' : k) === n);
  });
  renderVista();
}

function filtradas(){
  const q  = (document.getElementById('f-busca').value || '').trim().toLowerCase();
  const fs = document.getElementById('f-situacao').value;
  const fc = document.getElementById('f-corretor').value;
  const fe = document.getElementById('f-empr').value;
  return G.lista.filter(p => {
    if (fs && p.situacao_id !== fs) return false;
    if (fc && p.corretor_id !== fc) return false;
    if (fe && p.empreendimento_id !== fe) return false;
    if (G.filtroSla && sla(p).nivel !== G.filtroSla) return false;
    if (q){
      const t = G.titulares[p.id];
      const alvo = [p.codigo, p.unidade, t && t.nome, t && t.documento,
                    nomeEmpr(p.empreendimento_id)].join(' ').toLowerCase();
      // A comparação só por dígitos serve para achar o CPF digitado sem
      // pontuação. Só vale quando o que foi digitado TEM dígito: sem essa
      // guarda, buscar "Pedro" vira buscar "" — e "" está dentro de tudo,
      // então a busca por nome devolvia a fila inteira.
      const nums = soDigitos(q);
      if (!alvo.includes(q) && !(nums && soDigitos(alvo).includes(nums))) return false;
    }
    return true;
  });
}

// Quem manda na vista é o endereço, não uma variável desta tela. Guardar em
// global fazia a URL e o que estava na tela divergirem: o link direto abria uma
// coisa e o botão "voltar" do navegador não desfazia nada.
//
// Chamado antes de os dados chegarem, para o operador ver o quadro certo (com o
// indicador de carregando) em vez de uma faixa em branco enquanto a busca corre.
function aplicarVista(){
  const v = a1VistaDaURL();
  document.getElementById('pg-vista').textContent = v === 'listagem' ? 'Listagem' : 'Andamento';
  document.getElementById('vista-andamento').style.display = v === 'andamento' ? '' : 'none';
  document.getElementById('vista-listagem').style.display  = v === 'listagem'  ? '' : 'none';
  return v;
}

function renderVista(){
  const v = aplicarVista();
  const linhas = filtradas();
  document.getElementById('fila-contagem').textContent =
    `${linhas.length} de ${G.lista.length} pré-análise${G.lista.length===1?'':'s'}`;
  renderKpis();

  if (v === 'listagem') renderFila(linhas); else renderAndamento(linhas);
}

function renderFila(linhas){
  const wrap = document.getElementById('fila-wrap');
  if (!G.situacoes.length){
    wrap.innerHTML = `<div class="vazio"><strong>A esteira ainda não foi configurada.</strong><br>
      Peça ao administrador para criar as situações da Pré-análise no painel do superadmin.</div>`;
    return;
  }
  if (!linhas.length){
    wrap.innerHTML = `<div class="vazio">${G.lista.length ? 'Nenhuma pré-análise com esses filtros.' : 'Nenhuma pré-análise ainda.'}</div>`;

  wrap.innerHTML = `<table class="fila"><thead><tr>
      <th>Cliente</th><th>Código</th><th>Empreendimento</th><th>Corretor</th>

}

    <td>${esc(nomeCorretor(p.corretor_id))}</td>

function renderKpis(){

    <div class="kpi-card a"><div class="kpi-label">Atenção</div><div class="kpi-value">${conta('at')}</div>
         <div class="kpi-sub">passou de 75% do prazo</div></div>
    <div class="kpi-card r"><div class="kpi-label">Estourado</div><div class="kpi-value">${conta('ex')}</div></div>
    <div class="kpi-card g"><div class="kpi-label">Aprovadas</div><div class="kpi-value">${aprovadas}</div></div>`;

function abrirAssistente(){
  G.passo = 1;
  G.rascunho = { empreendimento_id:'', unidade:'', imobiliaria_id:'',
                 titular:{ documento:'', nome:'', nascimento:'', telefone:'', email:'', estado_civil:'' },
                 pessoaExistente:null,
                 renda_declarada:'', fonte_renda:'', associados:[] };
  document.getElementById('modal-nova').classList.remove('hidden');
  renderPasso();
}

function renderPasso(){
  const n = G.passo;
  [1,2,3].forEach(i => {
    const el = document.getElementById('passo-'+i);
    el.className = 'passo' + (i===n ? ' on' : (i<n ? ' ok' : ''));
  });
  document.getElementById('nova-sub').textContent =
    `Passo ${n} de 3 — ` + ['o negócio','quem é o titular','renda e associados'][n-1];
  document.getElementById('nova-voltar').style.visibility = n===1 ? 'hidden' : 'visible';
  document.getElementById('nova-avancar').textContent = n===3 ? 'Criar pré-análise' : 'Avançar';

}

function renderAssociados(){

function addAssociado(){ guardarPasso(); G.rascunho.associados.push({documento:'',nome:'',renda:''}); renderPasso(); }
function remAssociado(i){ guardarPasso(); G.rascunho.associados.splice(i,1); renderPasso(); }

function guardarPasso(){
  const v = id => { const e = document.getElementById(id); return e ? e.value : undefined; };
  const r = G.rascunho;
  if (G.passo === 1){
    if (v('w-empr')    !== undefined) r.empreendimento_id = v('w-empr');
    if (v('w-unidade') !== undefined) r.unidade           = v('w-unidade');
    if (v('w-imob')    !== undefined) r.imobiliaria_id    = v('w-imob');
  }
  if (G.passo === 2){
    const t = r.titular;
    if (v('w-doc')  !== undefined) t.documento  = v('w-doc');
    if (v('w-nome') !== undefined) t.nome       = v('w-nome');
    if (v('w-nasc') !== undefined) t.nascimento = v('w-nasc');
    if (v('w-ec')   !== undefined) t.estado_civil = v('w-ec');
    if (v('w-tel')  !== undefined) t.telefone   = v('w-tel');
    if (v('w-mail') !== undefined) t.email      = v('w-mail');
  }
  if (G.passo === 3){
    if (v('w-renda') !== undefined) r.renda_declarada = v('w-renda');
    if (v('w-fonte') !== undefined) r.fonte_renda     = v('w-fonte');
  }
}

async function buscarPessoa(){
  const doc = soDigitos(document.getElementById('w-doc').value);
  const msg = document.getElementById('w-doc-msg');
  if (doc.length !== 11 && doc.length !== 14){ msg.textContent = 'Informe um CPF ou CNPJ completo.'; return; }
  if (doc.length === 11 && !cpfValido(doc)){ msg.style.color = 'var(--red)'; msg.textContent = 'CPF inválido — confira os dígitos.'; return; }
  msg.style.color = 'var(--t3)'; msg.textContent = 'buscando…';
  const achou = await fetch(`${A1.rest('a1_pa_pessoas')}?documento=eq.${doc}&select=*`, { headers:A1.headers() })
    .then(r=>r.json()).catch(()=>[]);
  if (Array.isArray(achou) && achou[0]){
    const p = achou[0];
    G.rascunho.pessoaExistente = p.id;
    G.rascunho.titular = { documento:p.documento||'', nome:p.nome||'', nascimento:(p.nascimento||'').slice(0,10),
                           telefone:p.telefone||'', email:p.email||'', estado_civil:p.estado_civil||'' };
    renderPasso();
    const m2 = document.getElementById('w-doc-msg');
    m2.style.color = 'var(--green)'; m2.textContent = 'Já cadastrado — dados preenchidos.';
  } else {
    G.rascunho.pessoaExistente = null;
    msg.style.color = 'var(--t3)';
    msg.textContent = 'Não encontrado no cadastro. Preencha os dados ao lado.';
  }
}

function passoAnterior(){ guardarPasso(); G.passo = Math.max(1, G.passo-1); renderPasso(); }

async function passoSeguinte(){
  guardarPasso();
  const r = G.rascunho;
  if (G.passo === 1){
    if (!r.empreendimento_id){ toast('Escolha o empreendimento.','error'); return; }
    G.passo = 2; renderPasso(); return;
  }
  if (G.passo === 2){
    const doc = soDigitos(r.titular.documento);
    if (!r.titular.nome.trim()){ toast('O nome do titular é obrigatório.','error'); return; }
    if (doc.length === 11 && !cpfValido(doc)){ toast('CPF do titular inválido.','error'); return; }
    if (!doc){ toast('Informe o CPF ou CNPJ do titular.','error'); return; }
    G.passo = 3; renderPasso(); return;
  }
  await criarPreAnalise();
}

async function criarPreAnalise(){
  const btn = document.getElementById('nova-avancar');
  btn.disabled = true; btn.textContent = 'Criando…';
  try {
    const r = G.rascunho, tid = G.user.tenant_id;

    // 1. Pessoa titular — reaproveita a existente em vez de duplicar.
    let pessoaId = r.pessoaExistente;
    if (!pessoaId){
      const corpo = { tenant_id:tid, tipo: soDigitos(r.titular.documento).length===14 ? 'PJ' : 'PF',
                      documento: soDigitos(r.titular.documento), nome: r.titular.nome.trim(),
                      nascimento: r.titular.nascimento || null, estado_civil: r.titular.estado_civil || null,
                      telefone: r.titular.telefone || null, email: r.titular.email || null };
      const res = await fetch(A1.rest('a1_pa_pessoas'), { method:'POST', headers:A1.returnHeaders(), body:JSON.stringify(corpo) });
      if (!res.ok) throw new Error(await mensagemErro(res, 'Não foi possível cadastrar a pessoa.'));
      pessoaId = ((await res.json())[0] || {}).id;
    }
    if (!pessoaId) throw new Error('Não foi possível identificar o titular.');

    // 2. A pré-análise. Dono, cliente e situação inicial quem decide é o banco.
    const resPa = await fetch(A1.rest('a1_pre_analises'), {
      method:'POST', headers:A1.returnHeaders(),
      body: JSON.stringify({ tenant_id:tid, empreendimento_id:r.empreendimento_id,
                             unidade: r.unidade || null, imobiliaria_id: r.imobiliaria_id || null })
    });
    if (!resPa.ok) throw new Error(await mensagemErro(resPa, 'Não foi possível criar a pré-análise.'));
    const pa = (await resPa.json())[0];

    // 3. Participantes.
    const participantes = [{ tenant_id:tid, pre_analise_id:pa.id, pessoa_id:pessoaId, papel:'TITULAR',
                             renda_declarada: paraCentavos(r.renda_declarada),
                             fonte_renda: r.fonte_renda || null }];
    for (const a of r.associados){
      if (!a.nome.trim()) continue;
      const docA = soDigitos(a.documento);
      let idA = null;
      if (docA){
        const ex = await fetch(`${A1.rest('a1_pa_pessoas')}?documento=eq.${docA}&select=id`, { headers:A1.headers() })
          .then(x=>x.json()).catch(()=>[]);
        idA = (Array.isArray(ex) && ex[0]) ? ex[0].id : null;
      }
      if (!idA){
        const criada = await fetch(A1.rest('a1_pa_pessoas'), { method:'POST', headers:A1.returnHeaders(),
          body: JSON.stringify({ tenant_id:tid, documento: docA || null, nome: a.nome.trim() }) })
          .then(x => x.ok ? x.json() : []).catch(()=>[]);
        idA = (criada[0] || {}).id;
      }
      if (idA) participantes.push({ tenant_id:tid, pre_analise_id:pa.id, pessoa_id:idA,
                                    papel:'ASSOCIADO', renda_declarada: paraCentavos(a.renda) });
    }
    const resPart = await fetch(A1.rest('a1_pa_participantes'), {
      method:'POST', headers:A1.headers(), body: JSON.stringify(participantes) });
    if (!resPart.ok) toast('Pré-análise criada, mas houve erro ao gravar os participantes.','error');

    fecharModal('modal-nova');
    toast('Pré-análise criada.','success');
    await carregar();
    abrirDossie(pa.id);
  } catch (e){
    toast(e.message || 'Erro ao criar a pré-análise.','error');
  } finally {
    btn.disabled = false; btn.textContent = 'Criar pré-análise';
  }
}

// O PostgREST devolve o motivo em JSON. Mostrar "erro 403" para o operador não
// ajuda ninguém; mostrar a regra que barrou, sim.
async function mensagemErro(res, padrao){
  try {
    const j = await res.json();
    const m = j && (j.message || j.hint || j.details);
    if (res.status === 401 || res.status === 403 || /row-level security/i.test(m||''))
      return 'Você não tem permissão para isso.';
    return m || padrao;
  } catch { return padrao; }
}

async function abrirDossie(id){
  const pa = G.lista.find(p => p.id === id);
  if (!pa) return;
  G.atual = pa; G.abaDossie = 'dados';
  document.querySelectorAll('#dos-tabs .modal-tab').forEach(b =>
    b.classList.toggle('active', b.dataset.dt === 'dados'));
  document.getElementById('modal-dossie').classList.remove('hidden');
  document.getElementById('dos-body').innerHTML = '<div class="spinner" style="margin:2rem auto"></div>';

  const h = { headers:A1.headers() };
  const [part, cred, docs, ev, co] = await Promise.all([
    fetch(`${A1.rest('a1_pa_participantes')}?pre_analise_id=eq.${id}&select=*`, h).then(r=>r.json()).catch(()=>[]),
    fetch(`${A1.rest('a1_pa_analises_credito')}?pre_analise_id=eq.${id}&order=versao.desc`, h).then(r=>r.json()).catch(()=>[]),
    fetch(`${A1.rest('a1_pa_documentos')}?pre_analise_id=eq.${id}&order=criado_em.desc`, h).then(r=>r.json()).catch(()=>[]),
    fetch(`${A1.rest('a1_pa_eventos')}?pre_analise_id=eq.${id}&order=criado_em.desc&limit=100`, h).then(r=>r.json()).catch(()=>[]),
    fetch(`${A1.rest('a1_comerciais')}?pre_analise_id=eq.${id}&select=*`, h).then(r=>r.json()).catch(()=>[])
  ]);
  G.atualPart = Array.isArray(part) ? part : [];
  G.atualCred = Array.isArray(cred) ? cred : [];
  G.atualDocs = Array.isArray(docs) ? docs : [];
  G.atualEv   = Array.isArray(ev)   ? ev   : [];
  G.atualCo   = (Array.isArray(co) && co[0]) || null;

  const faltam = G.atualPart.map(p => p.pessoa_id).filter(pid => pid && !G.pessoas[pid]);
  if (faltam.length){
    const pes = await fetch(`${A1.rest('a1_pa_pessoas')}?id=in.(${faltam.join(',')})&select=*`, h)
      .then(r=>r.json()).catch(()=>[]);
    (Array.isArray(pes)?pes:[]).forEach(p => { G.pessoas[p.id] = p; });
  }

  const t = G.titulares[id];
  document.getElementById('dos-titulo').textContent = t ? t.nome : 'Pré-análise sem titular';
  document.getElementById('dos-sub').textContent =
    `${nomeEmpr(pa.empreendimento_id)}${pa.unidade ? ' · un. ' + pa.unidade : ''} · código ${pa.codigo || pa.id.slice(0,8)}`;
  document.getElementById('dos-situacao').innerHTML =
    `<span class="sit" style="background:${esc(corSituacao(pa.situacao_id))}">${esc(nomeSituacao(pa.situacao_id))}</span>`;
  montarRodapeDossie();
  renderDossie();
}

async function enviarDoc(){
  const arq = document.getElementById('doc-arq').files[0];
  if (!arq){ toast('Escolha um arquivo.','error'); return; }
  if (arq.size > 20 * 1024 * 1024){ toast('Arquivo acima de 20 MB.','error'); return; }
  const btn = document.getElementById('btn-doc'); btn.disabled = true; btn.textContent = 'Enviando…';
  try {
    const limpo = arq.name.replace(/[^\w.\-]+/g,'_').slice(-80);
    const chave = `${G.user.tenant_id}/pre-analise/${G.atual.id}/${Date.now()}_${limpo}`;
    if (!await A1.storageUpload('case-documents', chave, arq)) throw new Error('Falha no envio do arquivo.');
    const res = await fetch(A1.rest('a1_pa_documentos'), {
      method:'POST', headers:A1.returnHeaders(),
      body: JSON.stringify({ tenant_id:G.user.tenant_id, pre_analise_id:G.atual.id,
        tipo: document.getElementById('doc-tipo').value, storage_key: chave,
        nome_arquivo: arq.name, mime: arq.type || null })
    });
    if (!res.ok) throw new Error(await mensagemErro(res,'Não foi possível registrar o documento.'));
    G.atualDocs.unshift((await res.json())[0]);
    toast('Documento enviado.','success');
    renderDossie();
  } catch(e){ toast(e.message,'error'); }
  finally { const b = document.getElementById('btn-doc'); if (b){ b.disabled = false; b.textContent = 'Enviar'; } }
}

// O checklist não é decorativo: cada linha é exatamente uma condição que o
// banco vai conferir na hora de destravar o Comercial.
function checklist(){
  const temTitular  = G.atualPart.some(p => p.papel === 'TITULAR');
  const aprovado    = G.atualCred.some(c => c.status === 'APROVADO');
  const invalidada  = G.atualCred.some(c => c.status === 'INVALIDADA') && !aprovado;
  const docsPend    = G.atualDocs.filter(d => d.status !== 'APROVADO').length;
  return [
    { ok: temTitular, txt:'Titular definido',
      obs: temTitular ? '' : 'sem titular o cartão de Repasse não tem nome de cliente' },
    { ok: G.atualPart.some(p => Number(p.renda_declarada) > 0), txt:'Renda declarada informada',
      obs:'usada na composição de renda' },
    { ok: aprovado, txt:'Decisão de crédito aprovada e válida',
      obs: invalidada ? 'havia uma aprovação, mas um dado material mudou e ela foi invalidada' : '' },
    { ok: G.atualDocs.length > 0, txt:'Documentos enviados', obs: G.atualDocs.length + ' arquivo(s)' },
    { ok: docsPend === 0 && G.atualDocs.length > 0, txt:'Documentos analisados',
      obs: docsPend ? docsPend + ' pendente(s)' : '' }
  ];
}

        <div class="tl-meta">${esc(dataHoraBR(e.criado_em))}${e.ator_nome ? ' · ' + esc(e.ator_nome) : ''}</div></div>
    </div>`; }).join('')}</div>
  <div class="aviso i" style="margin-top:.9rem">O histórico só recebe linhas novas. Não se edita e não se
    apaga — nem pelo gestor, nem pela API.</div>`;
}
function rotuloEvento(e){
  return { transicao:'Mudança de situação', criado_da_pre_analise:'Comercial criado',
           decisao_invalidada:'Decisão de crédito invalidada' }[e] || e;
}

function dosComercial(){
  if (!G.atualCo){
    const c = checklist();
    const faltando = c.filter(i => !i.ok && /titular|crédito/i.test(i.txt));
    return `<div class="aviso i">Ainda não existe um Comercial para esta pré-análise.</div>
      ${faltando.length ? `<div class="aviso w">Falta: ${esc(faltando.map(f=>f.txt).join(', '))}.</div>` : ''}
      <p style="font-size:.82rem;line-height:1.5;color:var(--t2)">O Comercial nasce por
      <strong>ação da esteira</strong> — nunca por um cadastro paralelo. É isso que garante que ninguém
      pule a aprovação de crédito. Quando as condições estiverem cumpridas, o botão
      <strong>Habilitar Comercial</strong> aparece aqui embaixo.</p>`;
  }
  const co = G.atualCo, snap = co.origem_snapshot || {};
  const cr = snap.credito || {};
  return `
    <div class="aviso s">Comercial criado em ${esc(dataHoraBR(co.criado_em))}.</div>
    <div class="sec-title" style="margin-top:0">Fotografia do que foi aprovado</div>
    <div class="fgrid">
      <div class="fg"><label>Financiado</label><input value="${esc(brl(cr.valor_aprovado))}" disabled></div>
      <div class="fg"><label>Subsídio</label><input value="${esc(brl(cr.valor_subsidio))}" disabled></div>
      <div class="fg"><label>FGTS</label><input value="${esc(brl(cr.valor_fgts))}" disabled></div>
      <div class="fg"><label>Total</label><input value="${esc(brl(cr.valor_total))}" disabled></div>
    </div>
    <div class="aviso i" style="margin-top:.9rem">Esta fotografia não muda se a pré-análise mudar depois.
      O que entrou em negociação foi isto, e é isto que o histórico vai mostrar.</div>
    <div style="margin-top:1rem"><a class="btn btn-primary btn-sm" href="/${esc(G.slug)}/comercial?id=${esc(co.id)}">Abrir no Comercial ↗</a></div>`;
}

// ─── rodapé: ações e transições possíveis ────────────────────────────────────
function montarRodapeDossie(){
  const p = G.atual;
  const podeMover = perm('editar_repasses');

  // As situações de destino são as arestas que a esteira do cliente permite a
  // partir daqui. A tela não inventa caminho: mostra o que o banco aceita.
  const destinos = G.transicoes
    .filter(t => t.de_id === null || t.de_id === p.situacao_id)
    .map(t => G.situacoes.find(s => s.id === t.para_id))
    .filter((s,i,a) => s && a.indexOf(s) === i && s.id !== p.situacao_id);

  const sel = document.getElementById('dos-mover');
  sel.innerHTML = destinos.length
    ? destinos.map(s => `<option value="${esc(s.id)}">${esc(s.nome)}</option>`).join('')
    : '<option value="">nenhuma transição disponível</option>';
  sel.disabled = !destinos.length || !podeMover;
  document.getElementById('dos-btn-mover').disabled = !destinos.length || !podeMover;

  const acoes = document.getElementById('dos-acoes');
  const jaTem = !!G.atualCo;
  const podeHabilitar = !jaTem && podeMover &&
    G.atualPart.some(x => x.papel === 'TITULAR') &&
    G.atualCred.some(c => c.status === 'APROVADO');
  acoes.innerHTML = podeHabilitar
    ? `<button class="btn btn-primary btn-sm" id="btn-habilitar" onclick="habilitarComercial()">Habilitar Comercial</button>`
    : (jaTem ? `<span class="sub">Comercial já criado.</span>` : '');
}

async function moverSituacao(){
  const p = G.atual, para = document.getElementById('dos-mover').value;
  if (!para) return;
  const just = prompt('Justificativa (opcional):') || null;
  const btn = document.getElementById('dos-btn-mover'); btn.disabled = true;
  try {
    const res = await fetch(A1.rpc('a1_pa_transicionar'), {
      method:'POST', headers:A1.headers(),
      body: JSON.stringify({ p_pre_analise:p.id, p_para:para, p_justificativa:just, p_versao_esperada:p.versao })
    });
    const j = await res.json().catch(()=>null);
    if (!res.ok){ toast(traduzErro(j),'error'); return; }
    if (j && j.ok === false){ toast(j.erro || 'A esteira barrou a transição.','error'); return; }
    toast('Situação alterada.','success');
    fecharModal('modal-dossie');
    await carregar();
  } finally { btn.disabled = false; }
}

async function habilitarComercial(){
  const btn = document.getElementById('btn-habilitar'); btn.disabled = true; btn.textContent = 'Habilitando…';
  try {
    const res = await fetch(A1.rpc('a1_pa_executar_acao'), {
      method:'POST', headers:A1.headers(),
      body: JSON.stringify({ p_pre_analise:G.atual.id, p_acao:'ENABLE_COMMERCIAL' }) });
    const j = await res.json().catch(()=>null);
    if (!res.ok){ toast(traduzErro(j),'error'); return; }
    if (j && j.ok === false){ toast(j.erro || 'Não foi possível habilitar o Comercial.','error'); return; }
    toast('Comercial criado.','success');
    await abrirDossie(G.atual.id);
    trocarAbaDossie('comercial', document.querySelector('#dos-tabs [data-dt="comercial"]'));
  } finally {
    const b = document.getElementById('btn-habilitar');
    if (b){ b.disabled = false; b.textContent = 'Habilitar Comercial'; }
  }
}

// As funções do banco levantam exceção com um código curto. O operador precisa
// da regra em português, não do identificador do PL/pgSQL.
function traduzErro(j){
  const m = (j && (j.message || j.error)) || '';
  const mapa = {
    nao_encontrado:            'Processo não encontrado.',
    modulo_desabilitado:       'O módulo não está liberado para este cliente.',
    sem_acesso:                'Este processo não é da sua carteira.',
    sem_permissao:             'Você não tem permissão para isso.',
    versao_desatualizada:      'Alguém alterou este processo enquanto você o tinha aberto. Recarregue a tela.',
    transicao_nao_permitida:   'A esteira do cliente não permite essa mudança a partir da situação atual.',
    papel_nao_autorizado:      'Seu papel não pode fazer essa transição.',
    documentos_pendentes:      'Esta transição exige todos os documentos aprovados.',
    sem_aprovacao_valida:      'Não há decisão de crédito aprovada e válida.',
    sem_titular:               'A pré-análise não tem titular.',
    acao_desconhecida:         'Ação desconhecida.',
    modulo_comercial_desabilitado:'O módulo Comercial não está liberado para este cliente.'
  };
  for (const k in mapa) if (m.includes(k)) return mapa[k];
  return m || 'Não foi possível concluir a operação.';
}

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') document.querySelectorAll('.modal-bg:not(.hidden)').forEach(m => m.classList.add('hidden'));
});
init();
</script>
