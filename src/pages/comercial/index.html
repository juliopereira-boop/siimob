<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Venda — SIIMOB</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="theme-color" content="#04201D">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=DM+Mono:wght@400;500&display=swap" media="print" onload="this.media='all'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=DM+Mono:wght@400;500&display=swap"></noscript>
<link rel="stylesheet" href="/src/pages/comercial/index.css">
</head>
<body>

<div id="shell"></div>
<!-- O PAINEL DESTE MODULO.
     Ele ja existia em src/modules/paineis/paineis.js, mas so era alcancavel pelo seletor de
     painel do dashboard do Repasse — um modulo tinha de passar por outro para
     mostrar os proprios numeros. Agora e a terceira vista da propria tela,
     ao lado de Andamento e Listagem, como em qualquer modulo. -->
<div id="vista-painel" style="display:none;padding:1.1rem 1.15rem 3rem;max-width:1560px;margin:0 auto"></div>

<div class="main">
  <div class="kpi-grid" id="kpis"></div>

  <!-- Os filtros ficam FORA das vistas: quem recorta a lista e troca de vista
       pelo menu do cabeçalho espera reencontrar o mesmo recorte, não a base
       inteira de novo. -->
  <div class="toolbar" id="filtros">
    <input type="search" id="f-busca" placeholder="Cliente, unidade, código..." oninput="renderVistas()" style="min-width:220px">
    <select id="f-situacao" onchange="renderVistas()"><option value="">Todas as situações</option></select>
    <select id="f-corretor" onchange="renderVistas()"><option value="">Todos os corretores</option></select>
    <input type="date" id="f-inicio" aria-label="Criado a partir de" onchange="renderVistas()">
    <input type="date" id="f-fim" aria-label="Criado até" onchange="renderVistas()">
    <div class="seg" role="group" aria-label="Filtro de prazo">
      <button id="sla-todos" class="on" onclick="filtrarSla('')">Todos</button>
      <button id="sla-ok" onclick="filtrarSla('ok')">No prazo</button>
      <button id="sla-at" onclick="filtrarSla('at')">Atenção</button>
      <button id="sla-ex" onclick="filtrarSla('ex')">Estourado</button>
    </div>
    <div style="flex:1"></div>
    <span id="fila-contagem" style="font-size:.72rem;color:var(--t3)"></span>
  </div>

  <div id="vista-andamento"><div class="kanban" id="kanban"><div class="spinner" style="margin:2rem"></div></div></div>
  <div id="vista-listagem" style="display:none"><div class="tbl-wrap" id="fila-wrap"><div class="spinner" style="margin:2rem"></div></div></div>
</div>

<!-- ══════════ DOSSIÊ COMERCIAL ══════════ -->
<!-- ══════════ VENDA AVULSA ══════════
     Só existe quando a regra-mãe "Permitir criar venda avulsa" está ligada em
     Configurações › Configurações Gerais. Desligada, o botão nem é montado: a
     venda continua nascendo só de uma pré-análise aprovada, que é como o
     sistema sempre funcionou.
     Os campos são os mínimos para o cartão existir e ser reconhecido no quadro.
     Titular, crédito e condições NÃO entram aqui de propósito: venda avulsa não
     tem pré-análise por trás, então não há nada aprovado para copiar, e pedir
     esses números na abertura seria convidar a inventá-los. Eles se preenchem no
     dossiê, onde já existe o lugar certo para cada um. -->
<div class="modal-bg hidden" id="modal-venda-avulsa">
  <div class="modal" style="max-width:520px">
    <div class="modal-hdr">
      <div><div class="modal-title">Nova venda</div>
           <div class="modal-sub">Sem pré-análise por trás — o crédito e as condições entram depois, no dossiê.</div></div>
      <button class="modal-close" onclick="fecharModal('modal-venda-avulsa')" aria-label="Fechar">×</button>
    </div>
    <div class="modal-body">
      <div class="fg"><label>Empreendimento</label>
        <select id="va-empr"></select></div>
      <div class="fg"><label>Unidade</label>
        <input id="va-unidade" placeholder="ex.: 101"></div>
      <div class="fg"><label>Valor da venda (R$)</label>
        <input id="va-valor" inputmode="decimal" placeholder="opcional"></div>
    </div>
    <div class="modal-foot">
      <button class="btn btn-ghost" onclick="fecharModal('modal-venda-avulsa')">Cancelar</button>
      <button class="btn btn-primary" id="va-salvar" onclick="criarVendaAvulsa()">Criar venda</button>
    </div>
  </div>
</div>

<div class="modal-bg hidden" id="modal-dossie">
  <div class="modal">
    <div class="modal-hdr">
      <div><div class="modal-title" id="dos-titulo"></div><div class="modal-sub" id="dos-sub"></div></div>
      <div style="display:flex;gap:.5rem;align-items:center">
        <span id="dos-situacao"></span>
        <button class="modal-close" onclick="fecharModal('modal-dossie')" aria-label="Fechar">×</button>
      </div>
    </div>
    <div class="modal-tabs" id="dos-tabs">
      <button class="modal-tab active" data-dt="proposta" onclick="trocarAbaDossie('proposta',this)">Proposta</button>
      <button class="modal-tab" data-dt="origem"    onclick="trocarAbaDossie('origem',this)">Origem</button>
      <button class="modal-tab" data-dt="contrato"  onclick="trocarAbaDossie('contrato',this)">Contrato</button>
      <button class="modal-tab" data-dt="documentos" onclick="trocarAbaDossie('documentos',this)">Documentos</button>
      <button class="modal-tab" data-dt="checklist" onclick="trocarAbaDossie('checklist',this)">Checklist</button>
      <button class="modal-tab" data-dt="historico" onclick="trocarAbaDossie('historico',this)">Histórico</button>
      <button class="modal-tab" data-dt="repasse"   onclick="trocarAbaDossie('repasse',this)">Repasse</button>
    </div>
    <div class="modal-body" id="dos-body"></div>
    <div class="modal-foot">
      <div id="dos-acoes" style="display:flex;gap:.45rem;flex-wrap:wrap"></div>

    </div>
  </div>
</div>

<div id="toast-wrap"></div>

<script src="/src/shared/api/config.js"></script>
<script src="/src/shared/utils/texto.js"></script>
<script src="/src/shared/auth/auth.js"></script>
<script src="/src/shared/ui/modulo-shell.js"></script>
<script src="/src/modules/paineis/paineis.js"></script>
<script src="/src/modules/configuracoes/regras-gerais.js"></script>
<script src="/src/shared/ui/avisos.js"></script>
<script src="/src/shared/ui/cobranca-aviso.js"></script>
<script src="/src/pages/comercial/main.js"></script>
</body>
</html>
